<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="4; url=./" />
  <title>页面走丢了 · 青孤项目</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #060810, #0d1220 55%, #10203a);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
        'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      color: #e2e8f0;
      text-align: center;
      padding: 24px;
    }
    .wrap { max-width: 480px; }
    .code {
      font-size: 108px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #22d3ee, #0891b2);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 4px;
    }
    .emoji { font-size: 48px; margin-top: 8px; }
    h1 { font-size: 22px; margin: 16px 0 8px; }
    p { font-size: 14px; color: #94a3b8; line-height: 1.7; }
    a {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 32px;
      border-radius: 999px;
      background: #06b6d4;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease;
      box-shadow: 0 4px 18px rgba(6, 182, 212, .35);
    }
    a:hover { transform: translateY(-2px); box-shadow: 0 8px 26px rgba(6, 182, 212, .45); }
    .hint { margin-top: 18px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <div class="emoji">🧭</div>
    <h1>这页走丢了</h1>
    <p>你访问的页面不存在,或链接已经失效。<br />别担心,我们送你回首页继续解闷。</p>
    <a href="./">回 首 页</a>
    <div class="hint">4 秒后自动跳转…</div>
  </div>
</body>
</html>
