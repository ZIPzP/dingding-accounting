<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>青孤项目 · 贪吃蛇</title>
<style>
/* ====== 青孤项目 · 游戏统一视觉系统 ====== */
:root {
  --cell: clamp(18px, 2.8vmin, 28px); --grid-w: 40; --grid-h: 30;
  --radius-sm: 8px; --radius: 14px; --radius-lg: 20px;
  --radius-full: 9999px;
  --font: "Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  --duration: 0.2s;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%; overflow:hidden;
  background:var(--g-bg,#fff5f8);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none; user-select:none;
}
body {
  display:flex; justify-content:center; align-items:center;
  font-family:var(--font);
}

/* ====== 布局 ====== */
.game-wrapper {
  position:relative; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:10px;
  transform-origin:center center;
  width:min(900px, 95vw); max-width:900px; max-height:95vh;
  overflow:hidden;
  background:var(--g-surface,#fff);
  border-radius:var(--radius);
  padding:20px 16px 14px;
  box-shadow:var(--g-shadow,0 2px 12px rgba(236,107,158,0.08));
  border:1px solid var(--g-border-light,#fae8ef);
}
@media (orientation:landscape) {
  .game-wrapper { flex-direction:row; gap:16px; }
}

/* ====== 标题栏 ====== */
.game-header {
  display:flex; align-items:center; gap:10px;
  width:calc(var(--cell) * var(--grid-w));
  padding:0 4px; flex-shrink:0;
}
.game-header .icon { width:28px; height:28px; flex-shrink:0; color:var(--g-primary,#ec6b9e); }
.game-header .title-text {
  font-size:clamp(17px, 2.5vw, 24px); font-weight:700; color:var(--g-text,#3d1a2a);
  letter-spacing:0.3px; white-space:nowrap;
}
.game-header .title-sub {
  font-size:12px; color:var(--g-text-secondary,#8b5a6b);
  margin-left:auto; white-space:nowrap;
}

/* ====== 信息栏 ====== */
.info-bar {
  display:flex; justify-content:space-between; align-items:center;
  width:calc(var(--cell) * var(--grid-w)); padding:0 4px;
  color:var(--g-text,#3d1a2a); font-size:14px; flex-shrink:0;
}
.info-bar span { min-width:60px; }
.info-bar span:last-child { text-align:right; }
#lbLink { cursor:pointer; color:var(--g-primary,#ec6b9e); }
#lbLink:active { opacity:0.7; }

/* ====== 画布容器 ====== */
.canvas-container {
  position:relative; flex-shrink:0;
  width:calc(var(--cell) * var(--grid-w));
  height:calc(var(--cell) * var(--grid-h));
}
canvas {
  display:block; width:100%; height:100%;
  border:2px solid var(--g-canvas-border,#e8d0de);
  border-radius:var(--radius-sm);
  background:var(--g-canvas-bg,#fdf2f8);
  touch-action:none;
}

/* ====== 遮罩层 ====== */
.overlay {
  position:absolute; top:0; left:0; right:0; bottom:0;
  display:flex; flex-direction:column;
  justify-content:center; align-items:center;
  background:var(--g-overlay,rgba(255,245,250,0.92));
  border-radius:var(--radius-sm);
  pointer-events:none; z-index:10;
  backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
}
.overlay.hidden { display:none; }
.overlay .title {
  font-size:clamp(24px,5vw,38px); font-weight:700;
  color:var(--g-primary,#ec6b9e); margin-bottom:4px;
}
.overlay .subtitle { font-size:clamp(14px,3vw,18px); color:var(--g-text,#3d1a2a); margin-bottom:4px; }
.overlay .hint { font-size:clamp(11px,2vw,13px); color:var(--g-text-secondary,#8b5a6b); margin-top:10px; text-align:center; }
.overlay .final-score { font-size:clamp(18px,4vw,26px); color:var(--g-text,#3d1a2a); font-weight:700; }

/* ====== 按钮 ====== */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:10px 24px; border-radius:var(--radius-full); border:none;
  font-family:var(--font); font-size:15px; font-weight:600;
  cursor:pointer; transition:all var(--duration) var(--ease);
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  min-height:42px;
}
.btn-primary {
  background:var(--g-primary,#ec6b9e); color:#fff;
  box-shadow:0 2px 8px rgba(236,107,158,0.25);
}
.btn-primary:active { background:var(--g-primary-dark,#d14d82); transform:scale(0.97); }
.btn-danger {
  background:var(--g-error,#f87171); color:#fff;
}
.btn-danger:active { opacity:0.85; transform:scale(0.97); }
.btn-secondary {
  background:var(--g-bg-secondary,#ffeaf2); color:var(--g-text,#3d1a2a);
}
.btn-secondary:active { opacity:0.8; transform:scale(0.97); }
.btn-ghost {
  background:transparent; color:var(--g-text-secondary,#8b5a6b);
  padding:8px 14px; font-size:13px; min-height:36px;
}
.btn-ghost:active { color:var(--g-primary,#ec6b9e); }

.btn-start {
  margin-top:12px; padding:14px 40px; font-size:clamp(15px,3.5vw,18px); font-weight:700;
}
.btn-xs {
  width:36px; height:36px; min-height:unset; padding:0; border-radius:var(--radius-sm);
  font-size:16px; font-weight:700;
}

/* ====== 名字输入 ====== */
.name-entry { text-align:center; margin-top:8px; }
.name-entry .prompt { font-size:clamp(13px,3vw,16px); color:var(--g-primary,#ec6b9e); margin-bottom:6px; white-space:nowrap; }
.name-entry input {
  background:var(--g-surface,#fff); border:2px solid var(--g-border,#f0c8d8);
  color:var(--g-text,#3d1a2a); font-size:clamp(16px,3vw,20px);
  padding:8px 14px; border-radius:var(--radius-sm); width:min(220px,60vw);
  text-align:center; outline:none; font-family:var(--font); pointer-events:auto;
}
.name-entry input:focus { border-color:var(--g-primary,#ec6b9e); }

/* ====== 开始界面选项 ====== */
.start-settings {
  display:flex; flex-direction:column; align-items:center; gap:10px;
  margin-top:12px; pointer-events:auto;
}
.setting-row {
  display:flex; align-items:center; gap:10px;
}
.setting-row span {
  color:var(--g-text,#3d1a2a); font-size:14px; white-space:nowrap;
}
.setting-val {
  color:var(--g-primary,#ec6b9e); font-size:14px; min-width:36px; text-align:center; font-weight:600;
}

/* ====== 排行榜面板 ====== */
.lb-panel {
  background:var(--g-surface,#fff); border:1px solid var(--g-border,#f0c8d8);
  border-radius:var(--radius); padding:10px 14px;
  width:min(360px,85vw); max-height:min(300px,40vh); overflow-y:auto;
  pointer-events:auto;
}
.lb-panel table { width:100%; border-collapse:collapse; font-size:clamp(12px,2.5vw,14px); color:var(--g-text,#3d1a2a); }
.lb-panel th { color:var(--g-text-secondary,#8b5a6b); font-weight:500; font-size:11px; padding-bottom:4px; border-bottom:1px solid var(--g-border-light,#fae8ef); }
.lb-panel th:nth-child(1){ width:44px; } .lb-panel th:nth-child(3){ width:60px; text-align:right; }
.lb-panel td { padding:5px 0; border-bottom:1px solid var(--g-border-light,#fae8ef); }
.lb-panel td:nth-child(3){ text-align:right; font-weight:700; color:var(--g-primary,#ec6b9e); }
.lb-panel tr:last-child td { border-bottom:none; }
.lb-panel tr.highlight td { color:var(--g-primary,#ec6b9e); background:var(--g-bg-secondary,#ffeaf2); border-radius:4px; }
.lb-panel .empty { text-align:center; color:var(--g-text-secondary,#8b5a6b); padding:24px 0; font-size:14px; }

/* ====== 排行榜全屏 ====== */
.lb-full {
  position:absolute; top:0; left:0; right:0; bottom:0;
  background:var(--g-overlay,rgba(255,245,250,0.92));
  border-radius:var(--radius-sm); backdrop-filter:blur(6px);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center; z-index:20;
}
.lb-full.hidden { display:none; }
.lb-full h2 { color:var(--g-primary,#ec6b9e); font-size:clamp(22px,5vw,34px); margin-bottom:16px; }
.lb-full .lb-table-wrap { max-height:55vh; overflow-y:auto; padding:0 16px; }
.lb-full table { border-collapse:collapse; font-size:clamp(14px,2.5vw,17px); color:var(--g-text,#3d1a2a); }
.lb-full th { color:var(--g-text-secondary,#8b5a6b); font-weight:500; font-size:12px; padding-bottom:6px; text-align:left; }
.lb-full td { padding:8px 20px; }
.lb-full td:nth-child(3){ text-align:right; font-weight:700; color:var(--g-primary,#ec6b9e); }
.lb-full tr:nth-child(even) td { background:var(--g-bg-secondary,#ffeaf2); border-radius:4px; }
.lb-full .bottom-hint { color:var(--g-text-secondary,#8b5a6b); font-size:clamp(11px,2vw,13px); margin-top:16px; text-align:center; }

/* ====== 触屏控件 ====== */
.touch-controls {
  display:flex; flex-shrink:0; gap:clamp(8px,3vw,20px);
  align-items:center; justify-content:center;
  width:100%; max-width:100vw; padding:0 4px;
  flex-wrap:wrap;
}
@media (orientation:landscape) {
  .touch-controls { flex-direction:column; width:auto; gap:16px; }
  .action-btns { grid-template-columns:1fr; }
}
.dpad {
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  grid-template-rows:1fr 1fr 1fr;
  gap:4px;
}
.dpad .btn-dir {
  width:clamp(50px,14vw,72px); height:clamp(50px,14vw,72px);
  border-radius:var(--radius-sm); border:1px solid var(--g-border,#f0c8d8);
  background:var(--g-surface,#fff); color:var(--g-text-secondary,#8b5a6b);
  font-size:clamp(22px,5.5vw,30px);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:all var(--duration) var(--ease);
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
.dpad .btn-dir:active, .dpad .btn-dir.pressed {
  background:var(--g-primary,#ec6b9e); color:#fff; border-color:var(--g-primary,#ec6b9e);
}
.dpad .empty { visibility:hidden; }
.action-btns {
  display:grid; grid-template-columns:1fr 1fr; gap:6px;
}
.action-btns .btn-act {
  padding:12px; border-radius:var(--radius-full); border:1px solid var(--g-border,#f0c8d8);
  font-size:clamp(13px,3vw,15px); font-family:var(--font); font-weight:600;
  cursor:pointer; white-space:nowrap;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  transition:all var(--duration) var(--ease); min-height:40px;
  background:var(--g-surface,#fff); color:var(--g-text,#3d1a2a);
  display:inline-flex; align-items:center; justify-content:center; gap:4px;
}
.action-btns .btn-act:active {
  background:var(--g-primary,#ec6b9e); color:#fff; border-color:var(--g-primary,#ec6b9e);
}
@media (hover:hover) and (pointer:fine) {
  .touch-controls { opacity:0.35; transition:opacity 0.3s; }
  .touch-controls:hover { opacity:1; }
}

/* 横屏模式 */
body.force-landscape .game-wrapper {
  width:calc(100vh - 20px); height:auto; flex-shrink:0;
}

/* ====== 返回按钮 ====== */
.back-btn {
  background: none; border: none; cursor: pointer; padding: 4px; margin-right: 2px;
  color: var(--g-text-secondary, #bfa0aa); display: flex; align-items: center; justify-content: center;
  border-radius: 6px; transition: all 0.2s; flex-shrink: 0;
}
.back-btn:hover { color: var(--g-primary, #34d399); background: var(--g-surface, rgba(52,211,153,0.08)); }

/* ====== 成就 Toast ====== */
.ach-toast {
  position: fixed; top: 20px; right: 20px; z-index: 9999;
  background: var(--g-surface, #fff); border: 1px solid var(--g-primary, #34d399);
  border-radius: 10px; padding: 12px 18px; display: flex; align-items: center; gap: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12); transform: translateX(120%); opacity: 0;
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  max-width: 280px; font-size: 13px; color: var(--g-text, #1e1e2e);
}
.ach-toast.show { transform: translateX(0); opacity: 1; }
.ach-toast .ach-icon { font-size: 28px; flex-shrink: 0; }
.ach-toast strong { color: var(--g-primary, #34d399); }

/* ====== 响应式断点 ====== */
@media (min-width: 900px) {
  .game-wrapper { padding: 24px; }
  .game-header { margin-bottom: 16px; }
}
@media (max-width: 600px) {
  .game-wrapper { width: 100%; padding: 12px; }
}
</style>
<script src="./theme-bridge.js"></script>

<script>
function goBack() {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: 'game-back' }, '*');
  } else {
    window.history.back();
  }
}

// ═══════════════════════════════════════════════════
//  成就系统
// ═══════════════════════════════════════════════════
const ACH_KEY = 'qg_ach_snake';
const ACHIEVEMENTS = [
  { id: 'a1', name: '初出茅庐', desc: '单局得分 ≥ 5', icon: '🐍', check: s => s >= 5 },
  { id: 'a2', name: '渐入佳境', desc: '单局得分 ≥ 15', icon: '⚡', check: s => s >= 15 },
  { id: 'a3', name: '蛇王降临', desc: '单局得分 ≥ 30', icon: '👑', check: s => s >= 30 },
];

let unlockedAch = [];

function loadAch() {
  try {
    const raw = localStorage.getItem(ACH_KEY);
    unlockedAch = raw ? JSON.parse(raw) : [];
  } catch { unlockedAch = []; }
}

function saveAch() {
  try { localStorage.setItem(ACH_KEY, JSON.stringify(unlockedAch)); } catch {}
}

function checkAch(args) {
  ACHIEVEMENTS.forEach(ach => {
    if (unlockedAch.includes(ach.id)) return;
    let earned = false;
    if (ach.id === 'a3' && typeof args.lines !== 'undefined') {
      earned = ach.check(args.score, args.lines);
    } else if (typeof args.isTetris !== 'undefined') {
      earned = ach.check(args.score, args.lines, args.isTetris);
    } else {
      earned = ach.check(args.score);
    }
    if (earned) {
      unlockedAch.push(ach.id);
      saveAch();
      showAchToast(ach);
    }
  });
}

function showAchToast(ach) {
  const toast = document.createElement('div');
  toast.className = 'ach-toast';
  toast.innerHTML = `<span class="ach-icon">${ach.icon}</span><div><strong>成就解锁!</strong><br>${ach.name} — ${ach.desc}</div>`;
  document.body.appendChild(toast);
  requestAnimationFrame(() => { toast.classList.add('show'); });
  setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 2800);
}

// ═══════════════════════════════════════════════════
//  配置
// ═══════════════════════════════════════════════════
const CELL = 20;
const GRID_PORTRAIT  = { w:40, h:30 };
const GRID_LANDSCAPE = { w:70, h:24 };
let GW = GRID_PORTRAIT.w, GH = GRID_PORTRAIT.h;
let W = CELL * GW, H = CELL * GH;
const MAX_FPS = 18, MIN_BASE_FPS = 1, MAX_BASE_FPS = 20;
const SCORE_PER_FOOD = 10, MAX_LB = 10;

const SNAKE_COLORS = [
  { name:'绿色', body:'#3cb43c', head:'#64dc64' },
  { name:'蓝色', body:'#3c78c8', head:'#64aaf0' },
  { name:'红色', body:'#c83c3c', head:'#f06464' },
  { name:'黄色', body:'#c8b428', head:'#f0dc50' },
  { name:'紫色', body:'#8c3cc8', head:'#b464f0' },
  { name:'青色', body:'#3cbec8', head:'#64e6f0' },
  { name:'白色', body:'#b4b4b4', head:'#dcdcdc' },
  { name:'橙色', body:'#dc8228', head:'#ffaa50' },
  { name:'彩虹', body:null, head:null },
];

// ═══════════════════════════════════════════════════
//  DOM
// ═══════════════════════════════════════════════════
const canvas    = document.getElementById('gameCanvas');
canvas.width  = W; canvas.height = H;
const ctx       = canvas.getContext('2d');
const wrapper   = document.getElementById('wrapper');
const container = document.getElementById('canvasContainer');

const scoreDisplay   = document.getElementById('scoreDisplay');
const speedDisplay   = document.getElementById('speedDisplay');
const startOverlay   = document.getElementById('startOverlay');
const pauseOverlay   = document.getElementById('pauseOverlay');
const gameOverOverlay= document.getElementById('gameOverOverlay');
const finalScore     = document.getElementById('finalScore');
const nameInput      = document.getElementById('nameInput');
const goLbPanel      = document.getElementById('goLbPanel');
const lbFullPage     = document.getElementById('lbFullPage');
const lbFullTable    = document.getElementById('lbFullTable');
const pauseLbHint    = document.getElementById('pauseLbHint');
const lbLink         = document.getElementById('lbLink');
const touchControls  = document.getElementById('touchControls');
const actionBtns     = document.querySelector('.action-btns');

// ═══════════════════════════════════════════════════
//  排行榜
// ═══════════════════════════════════════════════════
function loadLB() {
  try { const d=JSON.parse(localStorage.getItem('snake_hs')||'[]'); return Array.isArray(d)?d.slice(0,MAX_LB):[]; }
  catch { return []; }
}
function saveLB(e) { localStorage.setItem('snake_hs',JSON.stringify(e.slice(0,MAX_LB))); }
function isQualifying(s) {
  if(s<=0) return false;
  const lb=loadLB();
  return lb.length<MAX_LB || s>lb[lb.length-1].score;
}
function addToLB(name,score) {
  const lb=loadLB(); lb.push({name,score});
  lb.sort((a,b)=>b.score-a.score);
  const t=lb.slice(0,MAX_LB); saveLB(t); return t;
}
function escHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function renderLB(entries, hi, container) {
  if(!entries.length){ container.innerHTML='<div class="empty">暂无记录</div>'; return; }
  const m=['1','2','3'];
  let h='<table><thead><tr><th>排名</th><th>玩家</th><th>分数</th></tr></thead><tbody>';
  entries.forEach((e,i)=>{
    const cls=i===hi?' class="highlight"':'';
    const rk=i<3?`<b>${m[i]}</b>`:`${i+1}`;
    h+=`<tr${cls}><td>${rk}</td><td>${escHtml(e.name.slice(0,10))}</td><td>${e.score}</td></tr>`;
  });
  h+='</tbody></table>'; container.innerHTML=h;
}
function renderLBFull(entries) {
  if(!entries.length){ lbFullTable.innerHTML='<div class="empty" style="font-size:16px">暂无记录</div>'; return; }
  const m=['1','2','3'];
  let h='<table><thead><tr><th>排名</th><th>玩家</th><th>分数</th></tr></thead><tbody>';
  entries.forEach((e,i)=>{
    const rk=i<3?`<b>${m[i]}</b>`:`${i+1}`;
    h+=`<tr><td>${rk}</td><td>${escHtml(e.name.slice(0,10))}</td><td>${e.score}</td></tr>`;
  });
  h+='</tbody></table>'; lbFullTable.innerHTML=h;
}

// ═══════════════════════════════════════════════════
//  状态
// ═══════════════════════════════════════════════════
const DIR={ UP:[0,-1], DOWN:[0,1], LEFT:[-1,0], RIGHT:[1,0] };
let snake, direction, nextDirection, score, food = null, state, playerName, highlightRank;
let showPauseLB=false, lastTime=0, tickAccum=0;
let baseFPS = 6, colorIndex = 0, isRainbow = false;

// 获取当前画布的颜色 token（从 CSS 变量读取）
function getCanvasColors() {
  const style = getComputedStyle(document.documentElement);
  return {
    bg: style.getPropertyValue('--g-canvas-bg').trim() || '#fdf2f8',
    grid: style.getPropertyValue('--g-canvas-grid').trim() || '#f0e0ea',
  };
}

function initGame(){
  state='idle'; playerName=''; highlightRank=-1;
  score=0; food = null; // 初始化 food 为 null 防止 drawFood 报错
  loadAch();
  updateHUD();
  showStartScreen();
}

function showStartScreen(){
  hideAllOverlays();
  startOverlay.classList.remove('hidden');
  actionBtns.style.display='';
  updateHUD();
  // 立即绘制棋盘 + 提示（不再黑屏）
  drawBoardOnly();
}

// 仅绘制棋盘背景（无蛇无食物），用于开始界面
function drawBoardOnly() {
  const colors = getCanvasColors();
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = colors.bg; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = colors.grid; ctx.lineWidth = 0.5;
  for(let x=0;x<=W;x+=CELL){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0;y<=H;y+=CELL){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
}

function startGame(){
  const sx=Math.floor(GW/2), sy=Math.floor(GH/2);
  snake=[[sx,sy],[sx-1,sy],[sx-2,sy]];
  direction=DIR.RIGHT; nextDirection=DIR.RIGHT;
  score=0; food=spawnFood();
  state='playing'; highlightRank=-1;
  showPauseLB=false; lastTime=performance.now(); tickAccum=0;
  playerName=nameInput.value.trim()||'无名';
  hideAllOverlays();
  startOverlay.classList.add('hidden');
  actionBtns.style.display='none';
  updateHUD();
}
function spawnFood(){
  const set=new Set(snake.map(p=>p[0]+','+p[1]));
  const empty=[];
  for(let x=0;x<GW;x++) for(let y=0;y<GH;y++) if(!set.has(x+','+y)) empty.push([x,y]);
  return empty.length?empty[Math.floor(Math.random()*empty.length)]:[-1,-1];
}
function currentFPS(){ return Math.min(baseFPS+Math.floor(score/50),MAX_FPS); }
function changeSpeed(delta){
  baseFPS=Math.max(MIN_BASE_FPS,Math.min(MAX_BASE_FPS,baseFPS+delta));
  updateHUD();
}
function updateHUD(){
  scoreDisplay.textContent=`得分: ${score}`;
  speedDisplay.textContent=`速度: ${currentFPS()}`;
  const ci = colorIndex; const cn = SNAKE_COLORS[ci].name;
  lbLink.textContent=`排行榜 ▸`;
  const cnEl=document.getElementById('colorName');
  if(cnEl) cnEl.textContent=cn;
  const svEl=document.getElementById('speedVal');
  if(svEl) svEl.textContent=String(baseFPS);
}
function hideAllOverlays(){
  startOverlay.classList.add('hidden');
  pauseOverlay.classList.add('hidden');
  gameOverOverlay.classList.add('hidden');
  lbFullPage.classList.add('hidden');
  showPauseLB=false;
}

// ═══════════════════════════════════════════════════
//  方向输入
// ═══════════════════════════════════════════════════
const OPPOSITE={
  up:'down', down:'up', left:'right', right:'left',
  ArrowUp:'ArrowDown',ArrowDown:'ArrowUp',ArrowLeft:'ArrowRight',ArrowRight:'ArrowLeft',
  w:'s',s:'w',a:'d',d:'a'
};
const KEY_DIR={
  ArrowUp:DIR.UP, w:DIR.UP, ArrowDown:DIR.DOWN, s:DIR.DOWN,
  ArrowLeft:DIR.LEFT, a:DIR.LEFT, ArrowRight:DIR.RIGHT, d:DIR.RIGHT,
  up:DIR.UP, down:DIR.DOWN, left:DIR.LEFT, right:DIR.RIGHT,
};

function tryChangeDir(dirName) {
  if (state !== 'playing') return;
  const newDir = KEY_DIR[dirName];
  if (!newDir) return;
  const opp = OPPOSITE[dirName];
  const oppDir = opp ? KEY_DIR[opp] : null;
  if (oppDir && direction[0]===oppDir[0] && direction[1]===oppDir[1]) return;
  nextDirection = newDir;
}

// ═══════════════════════════════════════════════════
//  绘制
// ═══════════════════════════════════════════════════
let foodPulse=0;
function draw(){
  const colors = getCanvasColors();
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = colors.bg; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = colors.grid; ctx.lineWidth = 0.5;
  for(let x=0;x<=W;x+=CELL){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<=H;y+=CELL){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  drawFood(); drawSnake();
}

function drawSnake(){
  const now=Date.now();
  snake.forEach(([sx,sy],i)=>{
    const x=sx*CELL+1, y=sy*CELL+1, s=CELL-2;
    if(i===0){
      if(isRainbow){
        const hue=(now/60)%360;
        ctx.fillStyle=`hsl(${hue},80%,75%)`;
      }else{
        ctx.fillStyle=SNAKE_COLORS[colorIndex].head;
      }
      roundRect(x,y,s,s,5); ctx.fill();
      const cx=x+s/2, cy=y+s/2;
      const off={
        '0,-1':[[-4,-3],[4,-3]], '0,1':[[-4,3],[4,3]],
        '-1,0':[[-3,-4],[-3,4]], '1,0':[[3,-4],[3,4]]
      };
      const eyes=off[direction[0]+','+direction[1]]||[[0,0],[0,0]];
      eyes.forEach(([dx,dy])=>{
        const ex=cx+dx, ey=cy+dy;
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ex,ey,3,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(ex,ey,1.5,0,Math.PI*2); ctx.fill();
      });
    }else{
      if(isRainbow){
        const hue=(i*12+now/60)%360;
        ctx.fillStyle=`hsl(${hue},80%,50%)`;
      }else{
        const bodyHex=SNAKE_COLORS[colorIndex].body;
        const br=parseInt(bodyHex.slice(1,3),16);
        const bg=parseInt(bodyHex.slice(3,5),16);
        const bb=parseInt(bodyHex.slice(5,7),16);
        const ratio=Math.max(0.35,1-i/(snake.length*1.3));
        const r=Math.floor(br*ratio), g=Math.floor(bg*ratio), b=Math.floor(bb*ratio);
        ctx.fillStyle=`rgb(${r},${g},${b})`;
      }
      roundRect(x,y,s,s,4); ctx.fill();
    }
  });
}

function drawFood(){
  // 空值保护：food 未初始化时不绘制
  if (!food) return;
  const [fx,fy]=food; if(fx<0) return;
  const cx=fx*CELL+CELL/2, cy=fy*CELL+CELL/2;
  const r=CELL/2-2+foodPulse;
  const gr=r+5;
  const glow=ctx.createRadialGradient(cx,cy,r*0.5,cx,cy,gr);
  glow.addColorStop(0,'rgba(255,140,140,0.5)'); glow.addColorStop(1,'rgba(255,140,140,0)');
  ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(cx,cy,gr,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#f03c3c'; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.arc(cx-r/3,cy-r/3,Math.max(1,r/3),0,Math.PI*2); ctx.fill();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

// ═══════════════════════════════════════════════════
//  游戏循环
// ═══════════════════════════════════════════════════
function gameLoop(now){
  requestAnimationFrame(gameLoop);
  const interval=1000/currentFPS();
  tickAccum+=now-lastTime; lastTime=now;
  foodPulse=Math.abs(((Date.now()%800)-400)/400)*3;

  if(state==='playing'){
    while(tickAccum>=interval){
      tickAccum-=interval;
      update();
      if(state!=='playing'){tickAccum=0; break;}
    }
  }
  draw();
  updateOverlays();
}

function update(){
  direction=nextDirection;
  const [hx,hy]=snake[0], [dx,dy]=direction, nh=[hx+dx,hy+dy];
  if(nh[0]<0||nh[0]>=GW||nh[1]<0||nh[1]>=GH){ onGameOver(); return; }
  const willEat=nh[0]===food[0]&&nh[1]===food[1];
  if(!willEat) snake.pop();
  if(snake.some(s=>s[0]===nh[0]&&s[1]===nh[1])){ onGameOver(); return; }
  snake.unshift(nh);
  if(willEat){ score+=SCORE_PER_FOOD; food=spawnFood(); if(food[0]<0) state='gameover'; updateHUD(); }
}

function onGameOver(){
  state='gameover'; updateHUD();
  updateBtnPauseLabel();
  actionBtns.style.display='';
  checkAch({ score: score });
  if(isQualifying(score)){
    const lb=addToLB(playerName||'无名',score);
    highlightRank=lb.findIndex(e=>e.name===playerName&&e.score===score);
  }else{
    highlightRank=-1;
  }
  showGameOver();
}

// ═══════════════════════════════════════════════════
//  叠加层
// ═══════════════════════════════════════════════════
function showGameOver(){
  hideAllOverlays(); gameOverOverlay.classList.remove('hidden');
  finalScore.textContent=`最终得分: ${score}`;
  renderLB(loadLB(),highlightRank,goLbPanel);
}
function updateOverlays(){
  if(state==='idle'){
    startOverlay.classList.remove('hidden'); pauseOverlay.classList.add('hidden');
    gameOverOverlay.classList.add('hidden'); lbFullPage.classList.add('hidden');
  }else if(state==='paused'){
    pauseOverlay.classList.remove('hidden');
    if(showPauseLB){ pauseLbHint.innerHTML='<div class="lb-panel" style="margin-top:8px"></div>'; renderLB(loadLB(),-1,pauseLbHint.querySelector('.lb-panel')); }
    else pauseLbHint.innerHTML='按 L 查看排行榜';
    gameOverOverlay.classList.add('hidden'); lbFullPage.classList.add('hidden'); startOverlay.classList.add('hidden');
  }else if(state==='gameover'){
    pauseOverlay.classList.add('hidden'); lbFullPage.classList.add('hidden'); startOverlay.classList.add('hidden');
  }else if(state==='leaderboard'){
    pauseOverlay.classList.add('hidden'); gameOverOverlay.classList.add('hidden'); startOverlay.classList.add('hidden');
    lbFullPage.classList.remove('hidden'); renderLBFull(loadLB());
  }else{ hideAllOverlays(); startOverlay.classList.add('hidden'); }
}
function updateBtnPauseLabel(){
  const btn=document.getElementById('btnPause');
  if(state==='paused') btn.textContent='继续';
  else btn.textContent='暂停';
}

// ═══════════════════════════════════════════════════
//  键盘事件
// ═══════════════════════════════════════════════════
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='r'){
    if(state==='idle'){ startGame(); }else{ startGame(); }
    updateBtnPauseLabel(); return;
  }
  if(state==='idle'){
    if(k==='enter'){ startGame(); updateBtnPauseLabel(); return; }
    if(k==='='||k==='+'){ e.preventDefault(); changeSpeed(1); return; }
    if(k==='-'){ e.preventDefault(); changeSpeed(-1); return; }
    if(k==='c'){ e.preventDefault();
      colorIndex=(colorIndex+1)%SNAKE_COLORS.length;
      isRainbow=(colorIndex===SNAKE_COLORS.length-1);
      updateHUD(); return;
    }
    return;
  }
  if(k==='escape'||k==='q'){
    if(state==='leaderboard'){ state='playing'; hideAllOverlays(); updateBtnPauseLabel(); return; }
    startGame(); updateBtnPauseLabel(); return;
  }
  if(k==='l'){ e.preventDefault();
    if(state==='playing') state='leaderboard';
    else if(state==='leaderboard'){ state='playing'; updateBtnPauseLabel(); }
    else if(state==='paused') showPauseLB=!showPauseLB;
    updateOverlays(); return;
  }
  if(k==='='||k==='+'){ e.preventDefault(); changeSpeed(1); return; }
  if(k==='-'){ e.preventDefault(); changeSpeed(-1); return; }
  if(k==='c'){ e.preventDefault();
    colorIndex=(colorIndex+1)%SNAKE_COLORS.length;
    isRainbow=(colorIndex===SNAKE_COLORS.length-1);
    updateHUD(); return;
  }
  if(state==='gameover'||state==='leaderboard') return;
  if(k==='p'){
    if(state==='playing'){ state='paused'; showPauseLB=false; }
    else if(state==='paused'){ state='playing'; hideAllOverlays(); startOverlay.classList.add('hidden'); }
    updateOverlays(); updateBtnPauseLabel(); return;
  }
  tryChangeDir(e.key);
});

// ═══════════════════════════════════════════════════
//  触屏：滑动手势
// ═══════════════════════════════════════════════════
let touchStartX=0, touchStartY=0;
const SWIPE_THRESH=20;

canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===1){
    touchStartX=e.touches[0].clientX;
    touchStartY=e.touches[0].clientY;
  }
  e.preventDefault();
},{passive:false});
canvas.addEventListener('touchmove',e=>{ e.preventDefault(); },{passive:false});
canvas.addEventListener('touchend',e=>{
  if(state==='playing'){
    const dx=(e.changedTouches[0]?.clientX||touchStartX)-touchStartX;
    const dy=(e.changedTouches[0]?.clientY||touchStartY)-touchStartY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>=SWIPE_THRESH){
      if(Math.abs(dx)>Math.abs(dy)) tryChangeDir(dx>0?'right':'left');
      else tryChangeDir(dy>0?'down':'up');
    }
  }
  e.preventDefault();
},{passive:false});

// ═══════════════════════════════════════════════════
//  触屏：虚拟按钮
// ═══════════════════════════════════════════════════
function setupBtn(id, action, dirName){
  const btn=document.getElementById(id);
  if(!btn) return;
  btn.addEventListener('pointerdown',e=>{
    e.preventDefault(); e.stopPropagation();
    btn.classList.add('pressed');
    if(dirName) tryChangeDir(dirName);
    else action();
  });
  btn.addEventListener('pointerup',e=>{ e.preventDefault(); btn.classList.remove('pressed'); });
  btn.addEventListener('pointerleave',e=>{ btn.classList.remove('pressed'); });
  btn.addEventListener('pointercancel',e=>{ btn.classList.remove('pressed'); });
  btn.addEventListener('click',e=>e.preventDefault());
}

setupBtn('btnUp',    null, 'up');
setupBtn('btnDown',  null, 'down');
setupBtn('btnLeft',  null, 'left');
setupBtn('btnRight', null, 'right');
setupBtn('btnPause', ()=>{
  if(state==='idle'||state==='gameover'||state==='leaderboard') return;
  if(state==='playing'){ state='paused'; showPauseLB=false; actionBtns.style.display=''; }
  else if(state==='paused'){ state='playing'; hideAllOverlays(); actionBtns.style.display='none'; }
  updateOverlays(); updateBtnPauseLabel();
});
setupBtn('btnReset', ()=>{ startGame(); updateBtnPauseLabel(); });
setupBtn('btnLB', ()=>{
  if(state==='idle'){ state='leaderboard'; updateOverlays(); return; }
  if(state==='playing') state='leaderboard';
  else if(state==='leaderboard'){ state='playing'; updateBtnPauseLabel(); }
  else if(state==='paused') showPauseLB=!showPauseLB;
  updateOverlays();
});
setupBtn('btnSpeedDown', ()=>changeSpeed(-1));
setupBtn('btnSpeedUp',   ()=>changeSpeed(1));
setupBtn('btnColor', ()=>{
  colorIndex=(colorIndex+1)%SNAKE_COLORS.length;
  isRainbow=(colorIndex===SNAKE_COLORS.length-1);
  updateHUD();
});

// 开始界面颜色/速度按钮
document.getElementById('btnColorPrev')?.addEventListener('click',(e)=>{
  e.preventDefault(); e.stopPropagation();
  colorIndex=(colorIndex-1+SNAKE_COLORS.length)%SNAKE_COLORS.length;
  isRainbow=(colorIndex===SNAKE_COLORS.length-1);
  updateHUD();
});
document.getElementById('btnColorNext')?.addEventListener('click',(e)=>{
  e.preventDefault(); e.stopPropagation();
  colorIndex=(colorIndex+1)%SNAKE_COLORS.length;
  isRainbow=(colorIndex===SNAKE_COLORS.length-1);
  updateHUD();
});
document.getElementById('btnSpdDown')?.addEventListener('click',(e)=>{
  e.preventDefault(); e.stopPropagation();
  changeSpeed(-1);
});
document.getElementById('btnSpdUp')?.addEventListener('click',(e)=>{
  e.preventDefault(); e.stopPropagation();
  changeSpeed(1);
});

// 强制横屏切换
function setGridSize(landscape){
  const g=landscape?GRID_LANDSCAPE:GRID_PORTRAIT;
  GW=g.w; GH=g.h; W=CELL*GW; H=CELL*GH;
  canvas.width=W; canvas.height=H;
  wrapper.style.setProperty('--grid-w',GW);
  wrapper.style.setProperty('--grid-h',GH);
}

let forceLandscape=false;

// ═══════════════════════════════════════════════════
//  按钮事件
// ═══════════════════════════════════════════════════
document.getElementById('btnStartGame').addEventListener('click',(e)=>{
  e.preventDefault(); startGame(); updateBtnPauseLabel();
});
document.getElementById('btnRestart').addEventListener('click',(e)=>{
  e.preventDefault(); startGame(); updateBtnPauseLabel();
});
canvas.addEventListener('click',()=>{
  if(state==='idle'){ startGame(); updateBtnPauseLabel(); }
  else if(state==='gameover'){ startGame(); updateBtnPauseLabel(); }
});
lbLink.addEventListener('click',()=>{
  if(state==='idle'){ state='leaderboard'; updateOverlays(); return; }
  if(state==='playing'){ state='leaderboard'; updateOverlays(); }
  else if(state==='leaderboard'){ state='playing'; hideAllOverlays(); updateBtnPauseLabel(); startOverlay.classList.add('hidden'); }
});

// ═══════════════════════════════════════════════════
//  响应式缩放
// ═══════════════════════════════════════════════════
function resize(){
  const padV=24, padH=16;
  const infoH=32;
  const isLandscape=forceLandscape || (window.innerWidth > window.innerHeight);
  let availW, availH;
  if(isLandscape){
    const ctrlW=touchControls.offsetWidth||180;
    availW=(forceLandscape ? window.innerHeight : window.innerWidth)-padH-ctrlW-20;
    availH=(forceLandscape ? window.innerWidth : window.innerHeight)-padV-infoH;
  }else{
    const ctrlH=touchControls.offsetHeight||160;
    availW=window.innerWidth-padH;
    availH=window.innerHeight-padV-infoH-ctrlH-12;
  }
  const scaleW=availW/(W+4);
  const scaleH=availH/(H+4);
  const scale=Math.min(1, scaleW, scaleH);
  wrapper.style.transform=forceLandscape
    ? `rotate(90deg) scale(${scale})`
    : `scale(${scale})`;
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,300));
resize();

// ═══════════════════════════════════════════════════
//  启动
// ═══════════════════════════════════════════════════
initGame();
updateBtnPauseLabel();
requestAnimationFrame(gameLoop);
</script>
