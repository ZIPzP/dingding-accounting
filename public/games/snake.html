<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🐍 贪吃蛇</title>
<style>
  :root {
    --bg: #0f0f19;
    --snake-head: #64dc64; --snake-body: #3cb43c;
    --food: #f05050; --food-glow: #ff8c8c;
    --text: #dcdcdc; --text-dim: #8c8c8c; --accent: #ffc832;
    --cyan: #2ee6e6;
    --overlay: rgba(0,0,0,0.72); --panel: rgba(18,18,42,0.96);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#0a0a14; touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none;
  }
  body {
    display:flex; justify-content:center; align-items:center;
    font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;
  }

  /* ── 画布容器（铺满全屏，可整体旋转实现横屏） ── */
  #canvasWrap {
    position:relative;
    width:100vw; height:100vh;
    transform-origin:center center;
  }
  canvas {
    display:block; width:100%; height:100%;
    background:var(--bg);
    touch-action:none;
  }

  /* ── 顶部浮动控制（暂停 / 重开）── */
  #hud {
    position:fixed; top:max(12px, env(safe-area-inset-top));
    right:12px; display:none; gap:10px; z-index:30;
  }
  #hud.show { display:flex; }
  .hud-btn {
    width:46px; height:46px; border-radius:14px; border:none;
    background:rgba(30,30,50,0.7); color:#cfcfe6;
    font-size:20px; cursor:pointer; backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center;
    -webkit-tap-highlight-color:transparent;
    transition:background 0.12s;
  }
  .hud-btn:active { background:rgba(60,60,100,0.9); }

  /* ── 通用遮罩与卡片 ── */
  .overlay {
    position:fixed; inset:0; z-index:40;
    display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    background:var(--overlay);
    padding:24px;
  }
  .overlay.hidden { display:none; }
  .card {
    width:min(360px, 88vw);
    background:var(--panel);
    border:1px solid rgba(120,120,180,0.25);
    border-radius:24px; padding:28px;
    display:flex; flex-direction:column; align-items:stretch; gap:16px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .card .title { font-size:28px; font-weight:700; color:#fff; text-align:center; }

  /* ── 开始页 ── */
  .opt-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .opt-label { font-size:15px; color:var(--text-dim); }
  .seg { display:flex; gap:8px; }
  .seg button {
    padding:8px 14px; border-radius:14px; border:none; cursor:pointer;
    background:#1e1e32; color:#aab; font-size:15px; font-family:inherit;
    -webkit-tap-highlight-color:transparent; transition:all 0.12s;
  }
  .seg button.active { background:var(--cyan); color:#04222a; font-weight:700; }
  .orient-btn {
    padding:9px 16px; border-radius:14px; border:1px solid rgba(46,230,230,0.4);
    background:rgba(46,230,230,0.08); color:var(--cyan); font-size:15px;
    font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .btn-start {
    margin-top:6px; padding:15px; border-radius:28px; border:none;
    background:#3cb43c; color:#fff; font-size:20px; font-weight:700;
    font-family:inherit; cursor:pointer; transition:background 0.15s;
    -webkit-tap-highlight-color:transparent;
  }
  .btn-start:active { background:#2d8f2d; }
  .hint { font-size:13px; color:var(--text-dim); text-align:center; margin-top:2px; }

  /* ── 游戏结束结算行 ── */
  .stat-row { display:flex; align-items:center; justify-content:space-between; }
  .stat-row .k { font-size:15px; color:var(--text-dim); }
  .stat-row .v { font-size:20px; font-weight:700; }
  .v.score  { color:var(--cyan); }
  .v.length { color:#fbd34a; }
  .v.speed  { color:#b24bf1; }
  .v.best   { color:#3df58b; }

  /* ── 暂停提示 ── */
  .pause-tip { font-size:15px; color:var(--text); text-align:center; }
</style>
<script src="./theme-bridge.js"></script>
</head>
<body>

<div id="canvasWrap">
  <canvas id="gameCanvas"></canvas>
</div>

<!-- 顶部浮动控制 -->
<div id="hud">
  <button class="hud-btn" id="btnPause" title="暂停/继续">⏸</button>
  <button class="hud-btn" id="btnRestart" title="重新开始">🔄</button>
</div>

<!-- 开始页 -->
<div class="overlay" id="startOverlay">
  <div class="card">
    <div class="title" style="color:#64dc64">🐍 贪吃蛇</div>
    <div class="opt-row">
      <span class="opt-label">难度</span>
      <div class="seg" id="diffSeg">
        <button data-speed="4">慢</button>
        <button data-speed="6" class="active">中</button>
        <button data-speed="10">快</button>
      </div>
    </div>
    <div class="opt-row">
      <span class="opt-label">屏幕</span>
      <button class="orient-btn" id="btnOrient">📱 竖屏</button>
    </div>
    <button class="btn-start" id="btnStartGame">🎮 开始游戏</button>
    <div class="hint">键盘 WASD / 方向键 或 滑动屏幕控制</div>
  </div>
</div>

<!-- 暂停页 -->
<div class="overlay hidden" id="pauseOverlay">
  <div class="card">
    <div class="title" style="color:#c8c864">暂停中</div>
    <div class="pause-tip">按 P 或点 ⏸ 继续</div>
  </div>
</div>

<!-- 游戏结束页 -->
<div class="overlay hidden" id="gameOverOverlay">
  <div class="card">
    <div class="title" style="color:#f05050">游戏结束</div>
    <div class="stat-row"><span class="k">得分</span><span class="v score" id="goScore">0</span></div>
    <div class="stat-row"><span class="k">长度</span><span class="v length" id="goLength">0</span></div>
    <div class="stat-row"><span class="k">速度</span><span class="v speed" id="goSpeed">0</span></div>
    <div class="stat-row"><span class="k">最高分</span><span class="v best" id="goBest">0</span></div>
    <button class="btn-start" id="btnRestartGame" style="background:#2ee6e6;color:#04222a">🔄 再来一局</button>
    <div class="hint">点击画面任意处 或 按 R 也能重开</div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
//  配置
// ═══════════════════════════════════════════════════
const CELL = 26;
let GW, GH, W, H;
const MAX_FPS = 18, MIN_BASE_FPS = 1, MAX_BASE_FPS = 20;
const SCORE_PER_FOOD = 10, MAX_LB = 10;

const SNAKE_COLORS = [
  { name:'🟢 绿色', body:'#3cb43c', head:'#64dc64' },
  { name:'🔵 蓝色', body:'#3c78c8', head:'#64aaf0' },
  { name:'🔴 红色', body:'#c83c3c', head:'#f06464' },
  { name:'🟡 黄色', body:'#c8b428', head:'#f0dc50' },
  { name:'🟣 紫色', body:'#8c3cc8', head:'#b464f0' },
  { name:'🩵 青色', body:'#3cbec8', head:'#64e6f0' },
  { name:'⚪ 白色', body:'#b4b4b4', head:'#dcdcdc' },
  { name:'🟠 橙色', body:'#dc8228', head:'#ffaa50' },
  { name:'🌈 彩虹', body:null, head:null },
];

// ═══════════════════════════════════════════════════
//  DOM
// ═══════════════════════════════════════════════════
const canvas   = document.getElementById('gameCanvas');
const ctx      = canvas.getContext('2d');
const wrap     = document.getElementById('canvasWrap');
const hud      = document.getElementById('hud');
const startOverlay    = document.getElementById('startOverlay');
const pauseOverlay    = document.getElementById('pauseOverlay');
const gameOverOverlay = document.getElementById('gameOverOverlay');
const goScore  = document.getElementById('goScore');
const goLength = document.getElementById('goLength');
const goSpeed  = document.getElementById('goSpeed');
const goBest   = document.getElementById('goBest');

// ═══════════════════════════════════════════════════
//  排行榜（仅用于「最高分」）
// ═══════════════════════════════════════════════════
function loadLB() {
  try { const d=JSON.parse(localStorage.getItem('snake_hs')||'[]'); return Array.isArray(d)?d.slice(0,MAX_LB):[]; }
  catch { return []; }
}
function saveLB(e) { localStorage.setItem('snake_hs',JSON.stringify(e.slice(0,MAX_LB))); }
function addToLB(name,score) {
  const lb=loadLB(); lb.push({name,score});
  lb.sort((a,b)=>b.score-a.score);
  const t=lb.slice(0,MAX_LB); saveLB(t); return t;
}
function bestScore() { const lb=loadLB(); return lb.length?lb[0].score:0; }
function isQualifying(s) {
  if(s<=0) return false;
  const lb=loadLB();
  return lb.length<MAX_LB || s>lb[lb.length-1].score;
}

// ═══════════════════════════════════════════════════
//  状态
// ═══════════════════════════════════════════════════
const DIR={ UP:[0,-1], DOWN:[0,1], LEFT:[-1,0], RIGHT:[1,0] };
let snake, direction, nextDirection, score, food, state;
let lastTime=0, tickAccum=0;
let baseFPS = 6, colorIndex = 0, isRainbow = false;
let preferredOrient = 'portrait';   // 开始页选择的横竖屏
let canvasRotation = 0;             // 0 / 90 / -90（仅强制横竖屏时非 0）

// ═══════════════════════════════════════════════════
//  布局：根据设备尺寸 + 偏好方向，铺满全屏
// ═══════════════════════════════════════════════════
function layout() {
  const devLandscape = window.innerWidth > window.innerHeight;
  const targetLandscape = (preferredOrient === 'landscape');
  const long = Math.max(window.innerWidth, window.innerHeight);
  const short = Math.min(window.innerWidth, window.innerHeight);

  // 棋盘行列（长边放列，短边放行）
  GW = Math.max(8, Math.floor((targetLandscape ? long : short) / CELL));
  GH = Math.max(8, Math.floor((targetLandscape ? short : long) / CELL));
  W = GW * CELL; H = GH * CELL;

  // 容器尺寸：填满视口
  const needRotate = (targetLandscape !== devLandscape);
  if (needRotate) {
    wrap.style.width  = long + 'px';
    wrap.style.height = short + 'px';
    canvasRotation = (targetLandscape && !devLandscape) ? 90 : -90;
    wrap.style.transform = `rotate(${canvasRotation}deg)`;
  } else {
    wrap.style.width = '100vw';
    wrap.style.height = '100vh';
    canvasRotation = 0;
    wrap.style.transform = 'none';
  }
  canvas.width = W; canvas.height = H;
}

function currentFPS(){ return Math.min(baseFPS + Math.floor(score/50), MAX_FPS); }

// ═══════════════════════════════════════════════════
//  游戏流程
// ═══════════════════════════════════════════════════
function showStartScreen(){
  state='idle'; hud.classList.remove('show');
  pauseOverlay.classList.add('hidden');
  gameOverOverlay.classList.add('hidden');
  startOverlay.classList.remove('hidden');
}

function startGame(){
  layout();
  const sx=Math.floor(GW/2), sy=Math.floor(GH/2);
  snake=[[sx,sy],[sx-1,sy],[sx-2,sy]];
  direction=DIR.RIGHT; nextDirection=DIR.RIGHT;
  score=0; food=spawnFood();
  state='playing'; lastTime=performance.now(); tickAccum=0;
  startOverlay.classList.add('hidden');
  pauseOverlay.classList.add('hidden');
  gameOverOverlay.classList.add('hidden');
  hud.classList.add('show');
  updatePauseLabel();
}

function spawnFood(){
  const set=new Set(snake.map(p=>p[0]+','+p[1]));
  const empty=[];
  for(let x=0;x<GW;x++) for(let y=0;y<GH;y++) if(!set.has(x+','+y)) empty.push([x,y]);
  return empty.length?empty[Math.floor(Math.random()*empty.length)]:[-1,-1];
}

function update(){
  direction=nextDirection;
  const [hx,hy]=snake[0], [dx,dy]=direction, nh=[hx+dx,hy+dy];
  if(nh[0]<0||nh[0]>=GW||nh[1]<0||nh[1]>=GH){ onGameOver(); return; }
  const willEat=nh[0]===food[0]&&nh[1]===food[1];
  if(!willEat) snake.pop();
  if(snake.some(s=>s[0]===nh[0]&&s[1]===nh[1])){ onGameOver(); return; }
  snake.unshift(nh);
  if(willEat){ score+=SCORE_PER_FOOD; food=spawnFood(); if(food[0]<0) state='gameover'; }
}

function onGameOver(){
  state='gameover'; hud.classList.remove('show');
  if(isQualifying(score)) addToLB('玩家', score);
  showGameOver();
  // 通知父框架（成就/最高分统计）
  try { parent.postMessage({ type:'gameEvent', game:'snake', event:'gameover', score }, '*'); } catch(e){}
}

function showGameOver(){
  pauseOverlay.classList.add('hidden');
  goScore.textContent  = score;
  goLength.textContent = snake.length;
  goSpeed.textContent  = currentFPS();
  goBest.textContent   = Math.max(bestScore(), score);
  gameOverOverlay.classList.remove('hidden');
}

function togglePause(){
  if(state==='playing'){ state='paused'; pauseOverlay.classList.remove('hidden'); }
  else if(state==='paused'){ state='playing'; pauseOverlay.classList.add('hidden'); lastTime=performance.now(); }
  updatePauseLabel();
}
function updatePauseLabel(){
  document.getElementById('btnPause').textContent = (state==='paused') ? '▶' : '⏸';
}

// ═══════════════════════════════════════════════════
//  绘制（网格 + 青色亮边 + 蛇 + 食物）
// ═══════════════════════════════════════════════════
let foodPulse=0;
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0f0f19'; ctx.fillRect(0,0,W,H);

  // 网格线（对齐格子，低对比白）
  ctx.strokeStyle='rgba(255,255,255,0.09)'; ctx.lineWidth=1;
  ctx.beginPath();
  for(let x=CELL;x<W;x+=CELL){ ctx.moveTo(x+0.5,0); ctx.lineTo(x+0.5,H); }
  for(let y=CELL;y<H;y+=CELL){ ctx.moveTo(0,y+0.5); ctx.lineTo(W,y+0.5); }
  ctx.stroke();

  // 亮边（边界提示）
  ctx.strokeStyle='rgba(46,230,230,0.85)'; ctx.lineWidth=3;
  roundRect(2,2,W-4,H-4,8); ctx.stroke();

  drawFood(); drawSnake();
}

function drawSnake(){
  const now=Date.now();
  snake.forEach(([sx,sy],i)=>{
    const x=sx*CELL+1, y=sy*CELL+1, s=CELL-2;
    if(i===0){
      ctx.fillStyle = isRainbow ? `hsl(${(now/60)%360},80%,75%)` : SNAKE_COLORS[colorIndex].head;
      roundRect(x,y,s,s,5); ctx.fill();
      const cx=x+s/2, cy=y+s/2;
      const off={ '0,-1':[[-4,-3],[4,-3]], '0,1':[[-4,3],[4,3]], '-1,0':[[-3,-4],[-3,4]], '1,0':[[3,-4],[3,4]] };
      const eyes=off[direction[0]+','+direction[1]]||[[0,0],[0,0]];
      eyes.forEach(([dx,dy])=>{
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cx+dx,cy+dy,3,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(cx+dx,cy+dy,1.5,0,Math.PI*2); ctx.fill();
      });
    }else{
      if(isRainbow){
        ctx.fillStyle=`hsl(${(i*12+now/60)%360},80%,50%)`;
      }else{
        const bodyHex=SNAKE_COLORS[colorIndex].body;
        const br=parseInt(bodyHex.slice(1,3),16), bg=parseInt(bodyHex.slice(3,5),16), bb=parseInt(bodyHex.slice(5,7),16);
        const ratio=Math.max(0.35,1-i/(snake.length*1.3));
        ctx.fillStyle=`rgb(${Math.floor(br*ratio)},${Math.floor(bg*ratio)},${Math.floor(bb*ratio)})`;
      }
      roundRect(x,y,s,s,4); ctx.fill();
    }
  });
}

function drawFood(){
  if(!food || food[0]<0) return;
  const [fx,fy]=food;
  const cx=fx*CELL+CELL/2, cy=fy*CELL+CELL/2;
  const r=CELL/2-2+foodPulse;
  const gr=r+5;
  const glow=ctx.createRadialGradient(cx,cy,r*0.5,cx,cy,gr);
  glow.addColorStop(0,'rgba(255,140,140,0.5)'); glow.addColorStop(1,'rgba(255,140,140,0)');
  ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(cx,cy,gr,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#f05050'; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.arc(cx-r/3,cy-r/3,Math.max(1,r/3),0,Math.PI*2); ctx.fill();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

// ═══════════════════════════════════════════════════
//  游戏循环
// ═══════════════════════════════════════════════════
function gameLoop(now){
  requestAnimationFrame(gameLoop);
  foodPulse=Math.abs(((Date.now()%800)-400)/400)*3;
  if(state==='playing'){
    const interval=1000/currentFPS();
    tickAccum+=now-lastTime; lastTime=now;
    while(tickAccum>=interval){
      tickAccum-=interval;
      update();
      if(state!=='playing'){ tickAccum=0; break; }
    }
  } else {
    lastTime=now;
  }
  draw();
}

// ═══════════════════════════════════════════════════
//  方向输入
// ═══════════════════════════════════════════════════
const OPPOSITE={ up:'down', down:'up', left:'right', right:'left',
  ArrowUp:'ArrowDown',ArrowDown:'ArrowUp',ArrowLeft:'ArrowRight',ArrowRight:'ArrowLeft',
  w:'s',s:'w',a:'d',d:'a' };
const KEY_DIR={ ArrowUp:DIR.UP, w:DIR.UP, ArrowDown:DIR.DOWN, s:DIR.DOWN,
  ArrowLeft:DIR.LEFT, a:DIR.LEFT, ArrowRight:DIR.RIGHT, d:DIR.RIGHT };

function tryChangeDir(dirName){
  if(state!=='playing') return;
  const nd=KEY_DIR[dirName]; if(!nd) return;
  const opp=OPPOSITE[dirName]; const od=opp?KEY_DIR[opp]:null;
  if(od && direction[0]===od[0] && direction[1]===od[1]) return;
  nextDirection=nd;
}

// ═══════════════════════════════════════════════════
//  键盘
// ═══════════════════════════════════════════════════
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='r'){ if(state!=='idle'){ startGame(); } return; }
  if(state==='idle'){ if(k==='enter') startGame(); return; }
  if(k==='escape'||k==='q'){ if(state==='gameover'||state==='paused') startGame(); return; }
  if(k==='p'){ togglePause(); return; }
  if(state==='gameover') return;
  if(k==='c'){ // 换色
    colorIndex=(colorIndex+1)%SNAKE_COLORS.length;
    isRainbow=(colorIndex===SNAKE_COLORS.length-1);
    return;
  }
  tryChangeDir(e.key);
});

// ═══════════════════════════════════════════════════
//  触屏滑动（含横竖屏旋转校正）
// ═══════════════════════════════════════════════════
let tStartX=0, tStartY=0;
const SWIPE=20;
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===1){ tStartX=e.touches[0].clientX; tStartY=e.touches[0].clientY; }
  e.preventDefault();
},{passive:false});
canvas.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
canvas.addEventListener('touchend',e=>{
  if(state==='playing'){
    const sx=(e.changedTouches[0]?.clientX||tStartX)-tStartX;
    const sy=(e.changedTouches[0]?.clientY||tStartY)-tStartY;
    if(Math.sqrt(sx*sx+sy*sy)>=SWIPE){
      // 屏幕向量 → 画布向量（按旋转校正）
      let cx, cy;
      if(canvasRotation===90){ cx=sy; cy=-sx; }
      else if(canvasRotation===-90){ cx=-sy; cy=sx; }
      else { cx=sx; cy=sy; }
      if(Math.abs(cx)>Math.abs(cy)) tryChangeDir(cx>0?'right':'left');
      else tryChangeDir(cy>0?'down':'up');
    }
  }
  e.preventDefault();
},{passive:false});

// ═══════════════════════════════════════════════════
//  UI 事件
// ═══════════════════════════════════════════════════
// 难度选择
document.getElementById('diffSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  baseFPS=parseInt(b.dataset.speed,10);
  [...e.currentTarget.children].forEach(c=>c.classList.toggle('active',c===b));
});
// 横竖屏切换
document.getElementById('btnOrient').addEventListener('click',()=>{
  preferredOrient = (preferredOrient==='portrait') ? 'landscape' : 'portrait';
  document.getElementById('btnOrient').textContent = (preferredOrient==='portrait') ? '📱 竖屏' : '🔄 横屏';
});
// 开始
document.getElementById('btnStartGame').addEventListener('click',startGame);
// 再来一局
document.getElementById('btnRestartGame').addEventListener('click',startGame);
// 顶部悬浮按钮
document.getElementById('btnPause').addEventListener('click',()=>{ if(state==='playing'||state==='paused') togglePause(); });
document.getElementById('btnRestart').addEventListener('click',startGame);
// 点击画面：idle→开始，gameover→重开
canvas.addEventListener('click',()=>{
  if(state==='idle') startGame();
  else if(state==='gameover') startGame();
});

// ═══════════════════════════════════════════════════
//  启动
// ═══════════════════════════════════════════════════
window.addEventListener('resize',()=>{
  // 尺寸变化（含设备旋转）→ 重新铺满；游戏中则重开以适配新网格
  if(state==='playing'||state==='paused') startGame();
  else layout();
});
window.addEventListener('orientationchange',()=>setTimeout(()=>{ state==='playing'?startGame():layout(); },300));

layout();
showStartScreen();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
