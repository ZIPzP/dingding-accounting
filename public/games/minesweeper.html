<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>青孤项目 · 扫雷</title>
<style>
:root{
  --font:"Microsoft YaHei","PingFang SC",Arial,sans-serif;
  --radius-sm:8px;
  --radius:14px;
  --radius-lg:20px;
  --radius-full:9999px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--g-bg);
  color:var(--g-text);
  font-family:var(--font);
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  user-select:none;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow-x:hidden
}
.container{
  max-width:900px;
  width:min(900px,95vw);
  padding:clamp(10px,3vw,20px);
  margin:0 auto
}
.title-group{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-bottom:clamp(8px,2vw,14px)
}
.title-icon{
  width:clamp(20px,5vw,26px);
  height:clamp(20px,5vw,26px);
  color:var(--g-primary);
  flex-shrink:0
}
.title{
  text-align:center;
  font-size:clamp(18px,4.5vw,26px);
  font-weight:bold;
  color:var(--g-text);
  white-space:nowrap
}
.title .dot{color:var(--g-primary);margin:0 4px}
.btn-theme{
  background:var(--g-surface);
  border:1px solid var(--g-border);
  color:var(--g-text-secondary);
  font-size:clamp(11px,2.5vw,13px);
  font-family:var(--font);
  padding:4px 12px;
  border-radius:var(--radius-full);
  cursor:pointer;
  transition:all .15s;
  margin-left:auto
}
.btn-theme:hover{color:var(--g-primary);border-color:var(--g-primary)}
.status-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--g-surface);
  border:1px solid var(--g-border-light);
  border-radius:var(--radius-sm);
  padding:clamp(6px,1.5vw,10px) clamp(10px,2.5vw,16px);
  margin-bottom:10px;
  font-size:clamp(14px,3.5vw,20px);
  box-shadow:var(--g-shadow)
}
.status-item{
  display:flex;
  align-items:center;
  gap:4px
}
.smiley-btn{
  font-size:clamp(22px,5.5vw,32px);
  background:var(--g-bg-secondary);
  border:1px solid var(--g-border);
  border-radius:var(--radius-sm);
  cursor:pointer;
  padding:2px 8px;
  line-height:1;
  transition:border-color .15s
}
.smiley-btn:hover{border-color:var(--g-primary)}
.smiley-btn:active{border-color:var(--g-primary)}
.mode-bar{
  display:flex;
  gap:8px;
  margin-bottom:10px;
  justify-content:center
}
.mode-btn{
  background:var(--g-surface);
  color:var(--g-text-secondary);
  border:1px solid var(--g-border-light);
  border-radius:var(--radius-full);
  padding:clamp(4px,1.2vw,8px) clamp(10px,2.5vw,18px);
  font-size:clamp(12px,3vw,16px);
  font-family:var(--font);
  cursor:pointer;
  transition:all .15s
}
.mode-btn:hover{border-color:var(--g-border)}
.mode-btn.active{
  background:var(--g-primary);
  border-color:var(--g-primary);
  color:#fff
}
.mine-counter{color:var(--g-error)}
.timer{color:var(--g-text-secondary)}
.grid-wrap{
  border:1px solid var(--g-canvas-border);
  border-radius:var(--radius-sm);
  padding:2px;
  background:var(--g-canvas-grid);
  margin-bottom:12px;
  box-shadow:var(--g-shadow)
}
.grid-container{
  display:grid;
  gap:1px;
  background:var(--g-canvas-grid);
  margin:0 auto;
  max-width:100%;
}
.cell{
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  cursor:pointer;
  background:var(--g-canvas-bg);
  transition:background .08s;
  font-size:clamp(14px,2.5vmin,22px);
  position:relative
}
/* 桌面端网格放大 */
@media (min-width: 768px) {
  .grid-container { max-width: min(600px, calc(90vh - 250px)); }
}
/* 响应式断点 */
@media (min-width: 900px) {
  .container { padding: 24px; }
}
@media (max-width: 600px) {
  .container { width: 100%; padding: 12px; }
}
.cell:hover{background:var(--g-bg-secondary)}
.cell.revealed{
  background:var(--g-bg-secondary);
  cursor:default
}
.cell.revealed:hover{background:var(--g-bg-secondary)}
.cell.flagged{background:var(--g-canvas-bg)}
.cell.flagged:hover{background:var(--g-bg-secondary)}
.cell.exploded{background:rgba(248,113,113,0.25)!important}
.cell.mine-show{background:var(--g-bg-secondary)}
.cell.num-1{color:#0000FF}
.cell.num-2{color:#008000}
.cell.num-3{color:#FF0000}
.cell.num-4{color:#000080}
.cell.num-5{color:#800000}
.cell.num-6{color:#008080}
.cell.num-7{color:#a0a0a0}
.cell.num-8{color:#808080}
.controls{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap
}
.btn{
  background:var(--g-surface);
  color:var(--g-text-secondary);
  border:1px solid var(--g-border-light);
  border-radius:var(--radius-full);
  padding:clamp(6px,1.5vw,10px) clamp(16px,4vw,28px);
  font-size:clamp(13px,3.2vw,17px);
  font-family:var(--font);
  cursor:pointer;
  transition:all .15s;
  touch-action:manipulation
}
.btn:hover{border-color:var(--g-border)}
.btn-green{background:var(--g-primary);color:#fff;border-color:var(--g-primary)}
.btn-green:hover{background:var(--g-primary-dark);border-color:var(--g-primary-dark)}
.help-text{
  text-align:center;
  color:var(--g-text-tertiary);
  font-size:clamp(11px,2.8vw,14px);
  margin-top:10px;
  line-height:1.6
}
.overlay{
  display:none;
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:var(--g-overlay);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  z-index:100;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  gap:16px
}
.overlay.show{display:flex}
.overlay-text{
  font-size:clamp(28px,7vw,42px);
  font-weight:bold;
  text-align:center
}
.overlay-text.win{color:var(--g-primary)}
.overlay-text.lose{color:var(--g-error)}
.overlay-sub{
  font-size:clamp(14px,3.5vw,20px);
  color:var(--g-text-secondary)
}
/* 返回按钮 */
.back-btn {
  background: none; border: none; cursor: pointer; padding: 4px; margin-right: 2px;
  color: var(--g-text-secondary, #bfa0aa); display: flex; align-items: center; justify-content: center;
  border-radius: 6px; transition: all 0.2s; flex-shrink: 0;
}
.back-btn:hover { color: var(--g-primary, #34d399); background: var(--g-surface, rgba(52,211,153,0.08)); }
/* 成就提示 */
.ach-toast {
  position: fixed; top: 20px; right: 20px; z-index: 9999;
  background: var(--g-surface, #fff); border: 1px solid var(--g-primary, #34d399);
  border-radius: 10px; padding: 12px 18px; display: flex; align-items: center; gap: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12); transform: translateX(120%); opacity: 0;
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  max-width: 280px; font-size: 13px; color: var(--g-text, #1e1e2e);
}
.ach-toast.show { transform: translateX(0); opacity: 1; }
.ach-toast .ach-icon { font-size: 28px; flex-shrink: 0; }
.ach-toast strong { color: var(--g-primary, #34d399); }
/* 最佳时间 */
.best-time-bar{ text-align:center; font-size:clamp(11px,2.8vw,14px); color:var(--g-text-tertiary); margin-bottom:8px; }
</style>
<script src="./theme-bridge.js"></script>
</head>
<body>

<div class="container">
  <div class="title-group">
    <button class="back-btn" onclick="goBack()" title="返回游戏大厅">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
    <svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 22V4"/>
      <path d="M4 4l14 3-14 3"/>
      <path d="M4 22h6"/>
    </svg>
    <span class="title">青孤项目<span class="dot">·</span>扫雷</span>
    <button class="btn-theme" onclick="if(window.toggleGameTheme)toggleGameTheme()">主题切换</button>
  </div>

  <div class="status-bar">
    <div class="status-item mine-counter">💣 <span id="mineCount">010</span></div>
    <button class="smiley-btn" id="smileyBtn">😊</button>
    <div class="status-item timer">⏱ <span id="timerDisplay">000</span></div>
  </div>

  <div class="best-time-bar" id="bestTimeDisplay"></div>

  <div class="mode-bar">
    <button class="mode-btn active" data-mode="beginner">初级 9×9</button>
    <button class="mode-btn" data-mode="expert">专家 16×16</button>
  </div>

  <div class="grid-wrap">
    <div class="grid-container" id="grid"></div>
  </div>

  <div class="controls">
    <button class="btn" id="restartBtn">重新开始</button>
  </div>

  <div class="help-text">
    左键/点击：揭开 &nbsp;|&nbsp; 右键/长按：标旗
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-text" id="overlayText"></div>
  <div class="overlay-sub" id="overlaySub"></div>
  <button class="btn btn-green" id="overlayRestart">再来一局</button>
</div>

<script>
// === 返回按钮 & 成就系统 & 最高分 ===
function goBack() {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: 'game-back' }, '*');
  } else {
    window.history.back();
  }
}

const ACH_KEY = 'qg_ach_minesweeper';
const ACHIEVEMENTS = [
  { id: 'a1', name: '排雷新手', desc: '通关初级模式', icon: '🚩', check: (mode, time) => mode === 'beginner' },
  { id: 'a2', name: '扫雷专家', desc: '通关专家模式', icon: '💣', check: (mode, time) => mode === 'expert' },
  { id: 'a3', name: '闪电清雷', desc: '60 秒内通关初级', icon: '⚡', check: (mode, time) => mode === 'beginner' && time <= 60 },
];

let unlockedAch = [];

function loadAch() {
  try {
    const raw = localStorage.getItem(ACH_KEY);
    unlockedAch = raw ? JSON.parse(raw) : [];
  } catch { unlockedAch = []; }
}

function saveAch() {
  try { localStorage.setItem(ACH_KEY, JSON.stringify(unlockedAch)); } catch {}
}

function checkAch(args) {
  ACHIEVEMENTS.forEach(ach => {
    if (unlockedAch.includes(ach.id)) return;
    let earned = false;
    if (typeof args.maxTile !== 'undefined') {
      earned = ach.check(args.score, args.maxTile);
    } else if (typeof args.mode !== 'undefined') {
      earned = ach.check(args.mode, args.time);
    } else if (typeof args.wins !== 'undefined') {
      earned = ach.check(args.wins);
    } else {
      earned = ach.check(args.score);
    }
    if (earned) {
      unlockedAch.push(ach.id);
      saveAch();
      showAchToast(ach);
    }
  });
}

function showAchToast(ach) {
  const toast = document.createElement('div');
  toast.className = 'ach-toast';
  toast.innerHTML = '<span class="ach-icon">' + ach.icon + '</span><div><strong>成就解锁!</strong><br>' + ach.name + ' — ' + ach.desc + '</div>';
  document.body.appendChild(toast);
  requestAnimationFrame(function() { toast.classList.add('show'); });
  setTimeout(function() { toast.classList.remove('show'); setTimeout(function() { toast.remove(); }, 400); }, 2800);
}

const HS_KEY = 'qg_hs_minesweeper';

function loadHighScore() {
  try {
    const raw = localStorage.getItem(HS_KEY);
    if (raw) { return JSON.parse(raw); }
  } catch {}
  return { beginner: 999, expert: 999 };
}

function saveHighScore(mode, time) {
  var hs = loadHighScore();
  if (time < hs[mode]) { hs[mode] = time; }
  try { localStorage.setItem(HS_KEY, JSON.stringify(hs)); } catch {}
  return hs;
}

(function(){
'use strict';

// === Constants ===
const MODES = {
  beginner: { rows: 9, cols: 9, mines: 10, label: '初级' },
  expert:   { rows: 16, cols: 16, mines: 40, label: '专家' }
};

const NUM_COLORS = ['','num-1','num-2','num-3','num-4','num-5','num-6','num-7','num-8'];

// === DOM References ===
const gridEl       = document.getElementById('grid');
const mineCountEl  = document.getElementById('mineCount');
const timerEl      = document.getElementById('timerDisplay');
const smileyBtn    = document.getElementById('smileyBtn');
const restartBtn   = document.getElementById('restartBtn');
const overlay      = document.getElementById('overlay');
const overlayText  = document.getElementById('overlayText');
const overlaySub   = document.getElementById('overlaySub');
const overlayRestart = document.getElementById('overlayRestart');
const modeBtns     = document.querySelectorAll('.mode-btn');

// === State ===
let rows, cols, mineCount;
let grid = [];            // 2D array: { mine, revealed, flagged, adjacent }
let revealedCount = 0;
let flagCount = 0;
let firstClick = true;
let gameActive = false;
let gameEnded = false;
let timer = 0;
let timerInterval = null;
let currentMode = 'beginner';

// Touch state
let pressTimer = null;
let pressCell = null;
let touchMoved = false;

// === Utility ===
function pad(n, len) {
  return String(n).padStart(len, '0');
}

function forEachNeighbor(r, c, fn) {
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
        fn(nr, nc);
      }
    }
  }
}

function setSmiley(state) {
  const map = { normal: '😊', lost: '😵', won: '😎' };
  smileyBtn.textContent = map[state] || '😊';
}

function updateBestTimeDisplay() {
  var hs = loadHighScore();
  var t = hs[currentMode];
  var el = document.getElementById('bestTimeDisplay');
  if (el) {
    el.textContent = t >= 999 ? '🏆 暂无最佳记录' : '🏆 最佳: ' + t + 's';
  }
}

// === Core Logic ===
function createGridData() {
  grid = [];
  for (let r = 0; r < rows; r++) {
    grid[r] = [];
    for (let c = 0; c < cols; c++) {
      grid[r][c] = { mine: false, revealed: false, flagged: false, adjacent: 0 };
    }
  }
  revealedCount = 0;
  flagCount = 0;
}

function placeMines(excludeR, excludeC) {
  // Build excluded set
  const excluded = new Set();
  excluded.add(excludeR + ',' + excludeC);
  forEachNeighbor(excludeR, excludeC, (nr, nc) => {
    excluded.add(nr + ',' + nc);
  });

  let placed = 0;
  while (placed < mineCount) {
    const r = Math.floor(Math.random() * rows);
    const c = Math.floor(Math.random() * cols);
    const key = r + ',' + c;
    if (!grid[r][c].mine && !excluded.has(key)) {
      grid[r][c].mine = true;
      placed++;
    }
  }

  // Calculate adjacency counts
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (grid[r][c].mine) continue;
      let cnt = 0;
      forEachNeighbor(r, c, (nr, nc) => { if (grid[nr][nc].mine) cnt++; });
      grid[r][c].adjacent = cnt;
    }
  }
}

function reveal(r, c) {
  if (r < 0 || r >= rows || c < 0 || c >= cols) return;
  const cell = grid[r][c];
  if (cell.revealed || cell.flagged) return;

  cell.revealed = true;
  revealedCount++;

  if (cell.mine) {
    // Should not happen with first-click safety, but handle anyway
    triggerGameOver(r, c);
    return;
  }

  if (cell.adjacent === 0) {
    forEachNeighbor(r, c, (nr, nc) => reveal(nr, nc));
  }
}

function checkWin() {
  return revealedCount === rows * cols - mineCount;
}

function triggerGameOver(mineR, mineC) {
  if (gameEnded) return;
  gameEnded = true;
  gameActive = false;
  stopTimer();
  setSmiley('lost');

  // Reveal all mines
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (grid[r][c].mine) {
        grid[r][c].revealed = true;
      }
    }
  }

  // Mark exploded cell
  if (mineR !== undefined && mineC !== undefined) {
    grid[mineR][mineC].exploded = true;
  }

  renderGrid();

  // Show overlay
  showOverlay('💥 游戏结束', '踩到地雷了...', 'lose');
}

function triggerWin() {
  if (gameEnded) return;
  gameEnded = true;
  gameActive = false;
  stopTimer();
  setSmiley('won');
  var hs = saveHighScore(currentMode, timer);
  checkAch({ mode: currentMode, time: timer });
  renderGrid();
  var bestTime = hs[currentMode];
  var subText;
  if (bestTime === timer) {
    subText = '🏆 新纪录！用时 ' + timer + ' 秒';
  } else {
    subText = '用时 ' + timer + ' 秒（最佳 ' + bestTime + ' 秒）';
  }
  showOverlay('🎉 你赢了！', subText, 'win');
  updateBestTimeDisplay();
}

function stopTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

function startTimer() {
  timer = 0;
  timerEl.textContent = pad(timer, 3);
  stopTimer();
  timerInterval = setInterval(() => {
    timer++;
    if (timer >= 999) timer = 999;
    timerEl.textContent = pad(timer, 3);
  }, 1000);
}

function showOverlay(text, sub, type) {
  overlayText.textContent = text;
  overlayText.className = 'overlay-text ' + (type === 'win' ? 'win' : 'lose');
  overlaySub.textContent = sub;
  overlay.classList.add('show');
}

function hideOverlay() {
  overlay.classList.remove('show');
}

// === Rendering ===
function renderGrid() {
  gridEl.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
  gridEl.innerHTML = '';

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = grid[r][c];
      const div = document.createElement('div');
      div.className = 'cell';
      div.dataset.row = r;
      div.dataset.col = c;

      if (cell.revealed) {
        if (cell.mine) {
          if (cell.exploded) {
            div.classList.add('exploded');
            div.textContent = '💥';
          } else {
            div.classList.add('revealed', 'mine-show');
            div.textContent = '💣';
          }
        } else {
          div.classList.add('revealed');
          if (cell.adjacent > 0) {
            div.textContent = cell.adjacent;
            div.classList.add(NUM_COLORS[cell.adjacent]);
          }
        }
      } else if (cell.flagged) {
        div.classList.add('flagged');
        div.textContent = '🚩';
      }

      gridEl.appendChild(div);
    }
  }

  updateMineCounter();
}

function updateMineCounter() {
  const remaining = mineCount - flagCount;
  mineCountEl.textContent = pad(Math.max(0, remaining), 3);
}

// === Game Actions ===
function handleReveal(r, c) {
  if (gameEnded) return;
  if (!gameActive) return;
  const cell = grid[r][c];
  if (!cell) return;
  if (cell.revealed) return;
  if (cell.flagged) return;

  if (firstClick) {
    firstClick = false;
    placeMines(r, c);
    startTimer();
  }

  if (cell.mine) {
    triggerGameOver(r, c);
    return;
  }

  reveal(r, c);
  renderGrid();

  if (checkWin()) {
    triggerWin();
  }
}

function handleFlag(r, c) {
  if (gameEnded) return;
  if (!gameActive) return;
  const cell = grid[r][c];
  if (!cell) return;
  if (cell.revealed) return;

  cell.flagged = !cell.flagged;
  flagCount += cell.flagged ? 1 : -1;
  renderGrid();
}

// === Reset ===
function resetGame() {
  hideOverlay();
  stopTimer();
  timer = 0;
  timerEl.textContent = '000';
  firstClick = true;
  gameActive = true;
  gameEnded = false;
  flagCount = 0;
  setSmiley('normal');

  createGridData();
  renderGrid();
}

// === Event Handlers ===

// Click handler (desktop left click)
gridEl.addEventListener('click', (e) => {
  const cellEl = e.target.closest('.cell');
  if (!cellEl) return;
  if (!gameActive || gameEnded) return;
  const r = parseInt(cellEl.dataset.row);
  const c = parseInt(cellEl.dataset.col);
  handleReveal(r, c);
});

// Context menu (right click)
gridEl.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  const cellEl = e.target.closest('.cell');
  if (!cellEl) return;
  if (!gameActive || gameEnded) return;
  const r = parseInt(cellEl.dataset.row);
  const c = parseInt(cellEl.dataset.col);
  handleFlag(r, c);
});

// Touch handling (long-press = flag, tap = reveal)
gridEl.addEventListener('touchstart', (e) => {
  const cellEl = e.target.closest('.cell');
  if (!cellEl) return;
  if (!gameActive || gameEnded) return;

  touchMoved = false;
  pressCell = cellEl;
  pressCell.dataset.longPress = ''; // Reset long-press state

  pressTimer = setTimeout(() => {
    pressTimer = null;
    if (touchMoved || !pressCell) return;
    const r = parseInt(pressCell.dataset.row);
    const c = parseInt(pressCell.dataset.col);
    pressCell.dataset.longPress = '1';
    handleFlag(r, c);
  }, 400);
}, { passive: true });

gridEl.addEventListener('touchmove', (e) => {
  touchMoved = true;
  if (pressTimer) {
    clearTimeout(pressTimer);
    pressTimer = null;
  }
}, { passive: true });

gridEl.addEventListener('touchend', (e) => {
  if (pressTimer) {
    clearTimeout(pressTimer);
    pressTimer = null;
    // Short tap = reveal
    if (!touchMoved && pressCell && !pressCell.dataset.longPress) {
      const r = parseInt(pressCell.dataset.row);
      const c = parseInt(pressCell.dataset.col);
      handleReveal(r, c);
    }
  }
  if (pressCell) {
    delete pressCell.dataset.longPress;
  }
  pressCell = null;
}, { passive: true });

// Smiley button = restart
smileyBtn.addEventListener('click', resetGame);

// Restart button
restartBtn.addEventListener('click', resetGame);

// Overlay restart button
overlayRestart.addEventListener('click', resetGame);

// Mode switching
modeBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    const mode = btn.dataset.mode;
    if (mode === currentMode) return;
    currentMode = mode;
    modeBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const config = MODES[mode];
    rows = config.rows;
    cols = config.cols;
    mineCount = config.mines;

    // Adjust grid font size for expert mode
    if (mode === 'expert') {
      gridEl.style.fontSize = 'clamp(9px,2vw,14px)';
    } else {
      gridEl.style.fontSize = '';
    }

    resetGame();
    updateBestTimeDisplay();
  });
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') resetGame();
});

// === Init ===
function init() {
  const config = MODES.beginner;
  rows = config.rows;
  cols = config.cols;
  mineCount = config.mines;
  gameActive = true;
  loadAch();
  createGridData();
  renderGrid();
  setSmiley('normal');
  updateBestTimeDisplay();
}

// Prevent context menu everywhere on the page
document.addEventListener('contextmenu', (e) => e.preventDefault());

init();

})();
</script>
</body>
</html>
