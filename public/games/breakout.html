<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>青孤项目 · 打砖块</title>
<style>
/* ====== 青孤项目 · 游戏统一视觉系统 ====== */
:root {
  --radius-sm: 8px; --radius: 14px; --radius-lg: 20px;
  --radius-full: 9999px;
  --font: "Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  --duration: 0.2s;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
html,body{width:100%;height:100%;overflow:hidden}
body{
  background:var(--g-bg,#fff5f8);
  color:var(--g-text,#3d1a2a);
  font-family:var(--font);
  display:flex;justify-content:center;align-items:center;
}
.container{
  width:min(900px, 95vw);
  max-width:900px;
  max-height:95vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:clamp(10px,3vw,20px);
  margin:0 auto;
}

/* ====== 游戏卡片 ====== */
.game-area{
  background:var(--g-surface,#fff);
  border:1px solid var(--g-border-light,#fae8ef);
  border-radius:var(--radius);
  box-shadow:var(--g-shadow,0 2px 12px rgba(236,107,158,0.08));
  padding:clamp(14px,3vw,22px);
}

/* ====== 标题栏 ====== */
.game-header{
  display:flex;align-items:center;gap:10px;
  margin-bottom:clamp(6px,1.5vw,12px);
}
.game-header .icon{
  width:28px;height:28px;flex-shrink:0;
  color:var(--g-primary,#ec6b9e);
}
.game-header .title-text{
  font-size:clamp(18px,4.5vw,22px);font-weight:700;
  color:var(--g-text,#3d1a2a);letter-spacing:0.3px;white-space:nowrap;
}
.game-header .title-sub{
  margin-left:auto;font-size:12px;
  color:var(--g-text-tertiary,#bfa0aa);cursor:pointer;white-space:nowrap;
}
.game-header .title-sub:active{color:var(--g-primary,#ec6b9e)}

.back-btn {
  background: none; border: none; cursor: pointer; padding: 4px; margin-right: 2px;
  color: var(--g-text-secondary, #bfa0aa); display: flex; align-items: center; justify-content: center;
  border-radius: 6px; transition: all 0.2s; flex-shrink: 0;
}
.back-btn:hover { color: var(--g-primary, #34d399); background: var(--g-surface, rgba(52,211,153,0.08)); }

/* ====== 信息栏 ====== */
.info-bar{
  display:flex;justify-content:space-between;align-items:center;
  background:var(--g-bg-secondary,#ffeaf2);
  border:1px solid var(--g-border-light,#fae8ef);
  border-radius:var(--radius-sm);
  padding:clamp(6px,1.5vw,10px) clamp(10px,2.5vw,16px);
  margin-bottom:10px;
  font-size:clamp(13px,3.2vw,18px);
  color:var(--g-text,#3d1a2a);
  gap:clamp(10px, 2vw, 24px);
}
.info-item{
  display:flex;align-items:center;gap:4px;
}
.score-val{color:var(--g-primary,#ec6b9e);font-weight:700}
.lives-val{color:var(--g-error,#f87171)}
.level-val{color:var(--g-text-secondary,#8b5a6b)}
.best-val{color:var(--g-primary,#34d399);font-weight:700}

/* ====== 画布容器 ====== */
.canvas-wrap{
  border:2px solid var(--g-canvas-border,#e8d0de);
  border-radius:var(--radius-sm);
  padding:2px;
  background:var(--g-surface,#fff);
  margin-bottom:12px;
  overflow:hidden;
  line-height:0;
  width:100%; display:flex; justify-content:center;
}
#gameCanvas{
  display:block;
  width:100%;
  height:auto;
  aspect-ratio:480/640;
  max-width:min(560px, calc(75vh * 0.75));
  max-height:75vh;
  background:var(--g-canvas-bg,#fdf2f8);
  border-radius:calc(var(--radius-sm) - 2px);
  touch-action:none;
}

/* ====== 按钮 ====== */
.controls{
  display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
}
.btn{
  background:var(--g-bg-secondary,#ffeaf2);
  color:var(--g-text,#3d1a2a);
  border:1px solid var(--g-border,#f0c8d8);
  border-radius:var(--radius-full);
  padding:clamp(8px,2vw,12px) clamp(20px,5vw,32px);
  font-size:clamp(13px,3.2vw,17px);
  font-family:inherit;font-weight:600;
  cursor:pointer;
  transition:all var(--duration) var(--ease);
  touch-action:manipulation;
}
.btn:hover{background:var(--g-border-light,#fae8ef)}
.btn-green{
  background:var(--g-primary,#ec6b9e);color:#fff;
  border-color:var(--g-primary,#ec6b9e);
  box-shadow:0 2px 8px rgba(236,107,158,0.25);
}
.btn-green:hover{background:var(--g-primary-dark,#d14d82)}
.btn-green:active{background:var(--g-primary-dark,#d14d82);transform:scale(0.97)}

.help-text{
  text-align:center;
  color:var(--g-text-secondary,#8b5a6b);
  font-size:clamp(11px,2.8vw,14px);
  margin-top:10px;
  line-height:1.6;
}
@media(pointer:coarse){
  .help-text{font-size:clamp(10px,2.5vw,13px)}
}

.ach-toast {
  position: fixed; top: 20px; right: 20px; z-index: 9999;
  background: var(--g-surface, #fff); border: 1px solid var(--g-primary, #34d399);
  border-radius: 10px; padding: 12px 18px; display: flex; align-items: center; gap: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12); transform: translateX(120%); opacity: 0;
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  max-width: 280px; font-size: 13px; color: var(--g-text, #1e1e2e);
}
.ach-toast.show { transform: translateX(0); opacity: 1; }
.ach-toast .ach-icon { font-size: 28px; flex-shrink: 0; }
.ach-toast strong { color: var(--g-primary, #34d399); }

/* ====== 响应式断点 ====== */
@media (min-width: 900px) {
  .container { padding: 24px; }
  .game-header { margin-bottom: 16px; }
}
@media (max-width: 600px) {
  .container { width: 100%; padding: 12px; }
}
</style>
<script src="./theme-bridge.js"></script>
</head>
<body>

<div class="container">
  <div class="game-area">
    <!-- 标题栏 -->
    <div class="game-header">
      <button class="back-btn" onclick="goBack()" title="返回游戏大厅">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="18" width="18" height="3" rx="1.5"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      <span class="title-text">青孤项目 · 打砖块</span>
      <span class="title-sub" onclick="if(typeof toggleGameTheme==='function')toggleGameTheme()">主题切换</span>
    </div>

    <div class="info-bar">
      <div class="info-item">得分: <span class="score-val" id="scoreDisplay">0</span></div>
      <div class="info-item lives-val" id="livesDisplay">❤️❤️❤️</div>
      <div class="info-item">最高: <span class="best-val" id="bestDisplay">0</span></div>
      <div class="info-item">关卡: <span class="level-val" id="levelDisplay">1</span></div>
    </div>

    <div class="canvas-wrap">
      <canvas id="gameCanvas" width="480" height="640"></canvas>
    </div>

    <div class="controls">
      <button class="btn btn-green" id="restartBtn">重新开始</button>
    </div>

    <div class="help-text">
      鼠标/手指移动控制挡板 &nbsp;|&nbsp; ← → 键盘方向键
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

// === 返回按钮 ===
function goBack() {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: 'game-back' }, '*');
  } else {
    window.history.back();
  }
}

// === 成就系统 ===
var ACH_KEY = 'qg_ach_breakout';
var ACHIEVEMENTS = [
  { id: 'a1', name: '初试砖块', desc: '通关第 1 关', icon: '🧱', check: function(l) { return l >= 2; } },
  { id: 'a2', name: '砖块猎人', desc: '通关第 5 关', icon: '⚡', check: function(l) { return l >= 6; } },
  { id: 'a3', name: '拆迁大师', desc: '通关第 10 关', icon: '💪', check: function(l) { return l >= 11; } },
];
var unlockedAch = [];

function loadAch() {
  try {
    var raw = localStorage.getItem(ACH_KEY);
    unlockedAch = raw ? JSON.parse(raw) : [];
  } catch(e) { unlockedAch = []; }
}

function saveAch() {
  try { localStorage.setItem(ACH_KEY, JSON.stringify(unlockedAch)); } catch(e) {}
}

function checkAch(args) {
  var level = args.level || 0;
  var score = args.score || 0;
  ACHIEVEMENTS.forEach(function(ach) {
    if (unlockedAch.indexOf(ach.id) >= 0) return;
    var earned = ach.check(typeof level !== 'undefined' ? level : score);
    if (earned) {
      unlockedAch.push(ach.id);
      saveAch();
      showAchToast(ach);
    }
  });
}

function showAchToast(ach) {
  var toast = document.createElement('div');
  toast.className = 'ach-toast';
  toast.innerHTML = '<span class="ach-icon">' + ach.icon + '</span><div><strong>成就解锁!</strong><br>' + ach.name + ' — ' + ach.desc + '</div>';
  document.body.appendChild(toast);
  requestAnimationFrame(function() { toast.classList.add('show'); });
  setTimeout(function() { toast.classList.remove('show'); setTimeout(function() { toast.remove(); }, 400); }, 2800);
}

// === 最高分系统 ===
var HS_KEY = 'qg_hs_breakout';

function loadHighScore() {
  try {
    var raw = localStorage.getItem(HS_KEY);
    if (raw) { var d = JSON.parse(raw); return d.score || 0; }
  } catch(e) {}
  return 0;
}

function saveHighScore(score) {
  try { localStorage.setItem(HS_KEY, JSON.stringify({ score: score, date: new Date().toISOString() })); } catch(e) {}
}

// === Canvas Setup ===
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreDisplay');
const livesEl = document.getElementById('livesDisplay');
const levelEl = document.getElementById('levelDisplay');
var bestDisplay = document.getElementById('bestDisplay');

const CW = 480, CH = 640;
canvas.width = CW;
canvas.height = CH;

// === Constants ===
const PADDLE_W = 80, PADDLE_H = 12, PADDLE_Y = CH - 40;
const BALL_R = 6;
const BRICK_ROWS = 8, BRICK_COLS = 8;
const BRICK_H = 18, BRICK_PAD = 4, BRICK_TOP = 44;
const BRICK_LEFT = 10;
const BRICK_W = (CW - BRICK_LEFT * 2 - BRICK_PAD * (BRICK_COLS - 1)) / BRICK_COLS;

const BRICK_COLORS = [
  '#e74c3c',  // red
  '#e67e22',  // orange
  '#f1c40f',  // yellow
  '#2ecc71',  // green
  '#1abc9c',  // cyan
  '#3498db',  // blue
  '#9b59b6',  // purple
  '#e91e90'   // pink
];

// === State ===
let score = 0;
let lives = 3;
let level = 1;
let launched = false;
let gameOver = false;
let levelTransition = false;
let transitionTimer = null;
let brickClearCount = 0;
let speedMult = 1.0;

let paddle = { x: (CW - PADDLE_W) / 2, y: PADDLE_Y, w: PADDLE_W, h: PADDLE_H };
let ball  = { x: CW / 2, y: PADDLE_Y - BALL_R, r: BALL_R, dx: 0, dy: 0 };
let bricks = [];

// === Helpers ===
function getBaseSpeed() {
  return 4 + (level - 1) * 0.5;
}

function getCurrentSpeed() {
  return getBaseSpeed() * speedMult;
}

// Read a CSS variable for canvas colors (theme-aware)
function readVar(name, fallback) {
  var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v || fallback;
}

// === Bricks ===
function createBricks() {
  bricks = [];
  for (let r = 0; r < BRICK_ROWS; r++) {
    for (let c = 0; c < BRICK_COLS; c++) {
      bricks.push({
        x: BRICK_LEFT + c * (BRICK_W + BRICK_PAD),
        y: BRICK_TOP + r * (BRICK_H + BRICK_PAD),
        w: BRICK_W,
        h: BRICK_H,
        alive: true,
        color: BRICK_COLORS[r % BRICK_COLORS.length]
      });
    }
  }
}

// === Ball ===
function resetBall() {
  ball.x = paddle.x + paddle.w / 2;
  ball.y = paddle.y - ball.r;
  ball.dx = 0;
  ball.dy = 0;
  launched = false;
}

function launchBall() {
  if (launched || gameOver || levelTransition) return;
  launched = true;
  const speed = getCurrentSpeed();
  // Launch mostly upward with slight random horizontal bias
  const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.6;
  ball.dx = speed * Math.sin(angle);
  ball.dy = speed * Math.cos(angle);
}

// === Update ===
function update() {
  if (gameOver || levelTransition) return;

  // Ball follows paddle when not launched
  if (!launched) {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r;
    return;
  }

  // Move ball
  ball.x += ball.dx;
  ball.y += ball.dy;

  // Wall bounces
  if (ball.x - ball.r < 0) { ball.x = ball.r; ball.dx = Math.abs(ball.dx); }
  if (ball.x + ball.r > CW) { ball.x = CW - ball.r; ball.dx = -Math.abs(ball.dx); }
  if (ball.y - ball.r < 0) { ball.y = ball.r; ball.dy = Math.abs(ball.dy); }

  // Fall off bottom = lose life
  if (ball.y + ball.r > CH) {
    lives--;
    updateUI();
    if (lives <= 0) {
      gameOver = true;
      var highScore = loadHighScore();
      if (score > highScore) { highScore = score; saveHighScore(score); bestDisplay.textContent = score; }
    } else {
      resetBall();
    }
    return;
  }

  // Paddle collision
  if (ball.dy > 0 &&
      ball.y + ball.r >= paddle.y &&
      ball.y - ball.r <= paddle.y + paddle.h &&
      ball.x + ball.r >= paddle.x &&
      ball.x - ball.r <= paddle.x + paddle.w) {

    const hitPos = Math.max(0, Math.min(1, (ball.x - paddle.x) / paddle.w));
    // Map hit position to angle: -60deg (left edge) to +60deg (right edge)
    const angle = (hitPos - 0.5) * Math.PI * 2 / 3;
    const speed = getCurrentSpeed();
    ball.dx = speed * Math.sin(angle);
    ball.dy = -speed * Math.cos(angle);

    // Ensure minimum horizontal speed to prevent boring straight-up bounces
    const minDx = speed * 0.12;
    if (Math.abs(ball.dx) < minDx) {
      ball.dx = ball.dx >= 0 ? minDx : -minDx;
    }

    ball.y = paddle.y - ball.r;
  }

  // Brick collisions
  for (let i = 0; i < bricks.length; i++) {
    const brick = bricks[i];
    if (!brick.alive) continue;

    // AABB overlap test
    if (ball.x + ball.r > brick.x &&
        ball.x - ball.r < brick.x + brick.w &&
        ball.y + ball.r > brick.y &&
        ball.y - ball.r < brick.y + brick.h) {

      brick.alive = false;
      score += 10;

      // Track bricks cleared for speed increase
      brickClearCount++;
      if (brickClearCount % 8 === 0) {
        speedMult *= 1.03;
        // Speed up the ball immediately (every 8 bricks cleared)
        ball.dx *= 1.03;
        ball.dy *= 1.03;
      }

      // Determine collision side and push ball out
      const overlapL = (ball.x + ball.r) - brick.x;
      const overlapR = (brick.x + brick.w) - (ball.x - ball.r);
      const overlapT = (ball.y + ball.r) - brick.y;
      const overlapB = (brick.y + brick.h) - (ball.y - ball.r);
      const minX = Math.min(overlapL, overlapR);
      const minY = Math.min(overlapT, overlapB);

      if (minX < minY) {
        ball.dx = -ball.dx;
        ball.x = overlapL < overlapR
          ? brick.x - ball.r
          : brick.x + brick.w + ball.r;
      } else {
        ball.dy = -ball.dy;
        ball.y = overlapT < overlapB
          ? brick.y - ball.r
          : brick.y + brick.h + ball.r;
      }

      updateUI();
      break; // one brick per frame
    }
  }

  // Level complete check
  if (bricks.every(b => !b.alive)) {
    levelTransition = true;
  }
}

// === Draw ===
function draw() {
  // Clear
  ctx.clearRect(0, 0, CW, CH);

  // Background
  ctx.fillStyle = readVar('--g-canvas-bg', '#fdf2f8');
  ctx.fillRect(0, 0, CW, CH);

  // --- Bricks ---
  for (const brick of bricks) {
    if (!brick.alive) continue;
    ctx.fillStyle = brick.color;
    ctx.fillRect(brick.x, brick.y, brick.w, brick.h);
    // Subtle highlight
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(brick.x, brick.y, brick.w, 2);
    // Subtle shadow
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(brick.x, brick.y + brick.h - 2, brick.w, 2);
  }

  // --- Paddle ---
  ctx.fillStyle = '#ffc832';
  ctx.shadowColor = 'rgba(255,200,50,0.25)';
  ctx.shadowBlur = 8;
  ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
  ctx.shadowBlur = 0;

  // --- Ball ---
  ctx.fillStyle = '#dcdcdc';
  ctx.shadowColor = 'rgba(220,220,220,0.35)';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // --- Launch instruction ---
  if (!launched && !gameOver) {
    ctx.fillStyle = readVar('--g-text-secondary', '#8b5a6b');
    ctx.font = '16px "Microsoft YaHei","PingFang SC",Arial,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('点击或按空格开始', CW / 2, paddle.y - 30);
  }

  // --- Game over overlay ---
  if (gameOver) {
    ctx.fillStyle = readVar('--g-overlay', 'rgba(255,245,250,0.92)');
    ctx.fillRect(0, 0, CW, CH);
    ctx.fillStyle = readVar('--g-error', '#f87171');
    ctx.font = 'bold 36px "Microsoft YaHei","PingFang SC",Arial,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('💥 游戏结束', CW / 2, CH / 2 - 30);
    ctx.fillStyle = readVar('--g-text', '#3d1a2a');
    ctx.font = '22px "Microsoft YaHei","PingFang SC",Arial,sans-serif';
    ctx.fillText('最终得分: ' + score, CW / 2, CH / 2 + 28);
    ctx.fillStyle = readVar('--g-text-secondary', '#8b5a6b');
    ctx.font = '16px "Microsoft YaHei","PingFang SC",Arial,sans-serif';
    ctx.fillText('点击重新开始', CW / 2, CH / 2 + 72);
  }

  // --- Level transition overlay ---
  if (levelTransition) {
    ctx.fillStyle = readVar('--g-overlay', 'rgba(255,245,250,0.92)');
    ctx.fillRect(0, 0, CW, CH);
    ctx.fillStyle = readVar('--g-primary', '#ec6b9e');
    ctx.font = 'bold 36px "Microsoft YaHei","PingFang SC",Arial,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🎉 第 ' + level + ' 关完成!', CW / 2, CH / 2 - 20);
    ctx.fillStyle = readVar('--g-text', '#3d1a2a');
    ctx.font = '20px "Microsoft YaHei","PingFang SC",Arial,sans-serif';
    ctx.fillText('准备进入下一关...', CW / 2, CH / 2 + 40);
  }
}

// === UI Update ===
function updateUI() {
  scoreEl.textContent = score;
  levelEl.textContent = level;
  livesEl.textContent = '❤️'.repeat(Math.max(0, lives));
  bestDisplay.textContent = loadHighScore();
}

// === Level Management ===
function nextLevel() {
  level++;
  brickClearCount = 0;
  speedMult = 1.0;
  levelTransition = false;
  createBricks();
  resetBall();
  updateUI();
}

// === Reset (full game) ===
function resetGame() {
  score = 0;
  lives = 3;
  level = 1;
  brickClearCount = 0;
  speedMult = 1.0;
  gameOver = false;
  levelTransition = false;
  if (transitionTimer) {
    clearTimeout(transitionTimer);
    transitionTimer = null;
  }
  paddle.x = (CW - PADDLE_W) / 2;
  createBricks();
  resetBall();
  updateUI();
}

// === Game Loop ===
function gameLoop() {
  update();
  draw();

  // Handle level transition with delay
  if (levelTransition && !transitionTimer) {
    transitionTimer = setTimeout(function() {
      transitionTimer = null;
      nextLevel();
      checkAch({ level: level });
    }, 1500);
  }

  requestAnimationFrame(gameLoop);
}

// === Event Handlers ===
// Mouse
canvas.addEventListener('mousemove', function(e) {
  if (gameOver || levelTransition) return;
  var rect = canvas.getBoundingClientRect();
  var x = (e.clientX - rect.left) * (CW / rect.width);
  paddle.x = Math.max(0, Math.min(CW - paddle.w, x - paddle.w / 2));
});

canvas.addEventListener('click', function(e) {
  if (gameOver) { resetGame(); return; }
  launchBall();
});

// Touch
canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  if (gameOver) { resetGame(); return; }
  var rect = canvas.getBoundingClientRect();
  var t = e.touches[0];
  var x = (t.clientX - rect.left) * (CW / rect.width);
  paddle.x = Math.max(0, Math.min(CW - paddle.w, x - paddle.w / 2));
  if (!launched) launchBall();
}, { passive: false });

canvas.addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (gameOver || levelTransition) return;
  var rect = canvas.getBoundingClientRect();
  var t = e.touches[0];
  var x = (t.clientX - rect.left) * (CW / rect.width);
  paddle.x = Math.max(0, Math.min(CW - paddle.w, x - paddle.w / 2));
}, { passive: false });

// Keyboard
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft') {
    paddle.x = Math.max(0, paddle.x - 20);
    e.preventDefault();
  } else if (e.key === 'ArrowRight') {
    paddle.x = Math.min(CW - paddle.w, paddle.x + 20);
    e.preventDefault();
  } else if (e.key === ' ' || e.key === 'Space') {
    e.preventDefault();
    if (gameOver) { resetGame(); return; }
    launchBall();
  }
});

// Restart button
document.getElementById('restartBtn').addEventListener('click', resetGame);

// === Init ===
createBricks();
resetBall();
updateUI();
loadAch();
bestDisplay.textContent = loadHighScore();
gameLoop();

})();
</script>
</body>
</html>
