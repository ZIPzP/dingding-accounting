<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>青孤项目 · 井字棋</title>
<style>
/* ====== 青孤项目 · 游戏统一视觉系统 ====== */
:root {
  --radius-sm: 8px; --radius: 14px; --radius-lg: 20px;
  --radius-full: 9999px;
  --font: "Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  --duration: 0.2s;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none;
}
html, body {
  width: 100%;
  min-height: 100dvh;
}
body {
  background: var(--g-bg,#fff5f8);
  color: var(--g-text,#3d1a2a);
  font-family: var(--font);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
}
.container {
  width: min(900px, 100%);
}
.game-area {
  background: var(--g-surface,#fff);
  border: 1px solid var(--g-border-light,#fae8ef);
  border-radius: var(--radius);
  box-shadow: var(--g-shadow,0 2px 12px rgba(236,107,158,0.08));
  padding: clamp(16px, 4vw, 28px);
  position: relative;
}

/* ====== 标题栏 ====== */
.game-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.game-header .icon {
  width: 28px; height: 28px; flex-shrink: 0;
  color: var(--g-primary,#ec6b9e);
}
.game-header .title-text {
  font-size: clamp(17px, 2.5vw, 24px);
  font-weight: 700;
  color: var(--g-text,#3d1a2a);
  letter-spacing: 0.3px;
  white-space: nowrap;
}
.game-header .title-sub {
  margin-left: auto;
  font-size: 12px;
  color: var(--g-text-tertiary,#bfa0aa);
  cursor: pointer;
  white-space: nowrap;
}
.game-header .title-sub:active { color: var(--g-primary,#ec6b9e); }

/* Scoreboard */
.scores {
  display: flex;
  justify-content: center;
  gap: clamp(16px, 4vw, 40px);
  margin-bottom: 16px;
}
.score-item {
  background: var(--g-bg-secondary,#ffeaf2);
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  text-align: center;
  font-size: clamp(12px, 3vw, 15px);
  color: var(--g-text-secondary,#8b5a6b);
  min-width: 70px;
}
.score-item .val {
  display: block;
  font-size: clamp(20px, 5vw, 28px);
  font-weight: bold;
  color: var(--g-text,#3d1a2a);
  line-height: 1.3;
}
.score-item.player .val { color: var(--g-primary,#ec6b9e); }
.score-item.ai .val { color: var(--g-text-secondary,#8b5a6b); }
.score-item.draw .val { color: var(--g-text-tertiary,#bfa0aa); }

/* Status */
.status {
  text-align: center;
  font-size: clamp(14px, 2vw, 18px);
  color: var(--g-text,#3d1a2a);
  margin-bottom: 14px;
  min-height: 1.6em;
  padding: 4px 0;
}
.status .highlight {
  color: var(--g-primary,#ec6b9e);
  font-weight: bold;
}

/* Grid */
.grid-container {
  position: relative;
  margin: 0 auto 16px;
  max-width: 480px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  background: var(--g-border,#f0c8d8);
  border: 2px solid var(--g-border,#f0c8d8);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.cell {
  aspect-ratio: 1;
  background: var(--g-surface,#fff);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: clamp(40px, 12vw, 72px);
  position: relative;
  transition: background 0.15s;
}
.cell:not(.taken):hover {
  background: var(--g-bg-secondary,#ffeaf2);
}
.cell:not(.taken):active {
  background: var(--g-border-light,#fae8ef);
}
.cell.taken {
  cursor: default;
}
.cell.win-cell {
  background: rgba(236, 107, 158, 0.12);
}

/* Mark styling */
.cell .mark {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  animation: markPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  transform-origin: center;
}
@keyframes markPop {
  0% {
    transform: scale(0);
    opacity: 0;
  }
  70% {
    transform: scale(1.15);
    opacity: 1;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}
.mark-x {
  color: var(--g-primary,#ec6b9e);
  font-weight: bold;
}
.mark-o {
  color: var(--g-text-secondary,#8b5a6b);
  font-weight: bold;
}

/* SVG win line */
.win-line-svg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 5;
}
.win-line {
  stroke: var(--g-primary,#ec6b9e);
  stroke-width: 4;
  stroke-linecap: round;
  fill: none;
  stroke-dasharray: 800;
  stroke-dashoffset: 800;
  animation: drawLine 0.45s ease forwards;
  filter: drop-shadow(0 0 6px rgba(236,107,158,0.5));
}
@keyframes drawLine {
  to {
    stroke-dashoffset: 0;
  }
}

/* Buttons */
.btn-row {
  display: flex;
  gap: 10px;
}
.btn {
  flex: 1;
  padding: clamp(10px, 2.5vw, 14px);
  font-size: clamp(14px, 3.5vw, 18px);
  font-family: inherit;
  border: none;
  border-radius: var(--radius-full);
  cursor: pointer;
  font-weight: bold;
  transition: background var(--duration) var(--ease), opacity 0.2s;
  letter-spacing: 1px;
}
.btn-green {
  background: var(--g-primary,#ec6b9e);
  color: #fff;
}
.btn-green:hover {
  background: var(--g-primary-dark,#d14d82);
}
.btn-green:active {
  background: var(--g-primary-dark,#d14d82);
}
.btn-gray {
  background: var(--g-bg-secondary,#ffeaf2);
  color: var(--g-text,#3d1a2a);
}
.btn-gray:hover {
  background: var(--g-border-light,#fae8ef);
}
.btn-gray:active {
  background: var(--g-border,#f0c8d8);
}
.btn-red {
  background: var(--g-error,#f87171);
  color: #fff;
}
.btn-red:hover {
  background: #ef4444;
}
.btn-red:active {
  background: #dc2626;
}
.btn:disabled {
  cursor: default;
  opacity: 0.5;
}

/* Turns indicator */
.turns {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 14px;
  font-size: clamp(13px, 3.2vw, 16px);
  color: var(--g-text-secondary,#8b5a6b);
}
.turns .turn-item {
  padding: 4px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  transition: all 0.25s;
}
.turns .turn-item.active {
  border-color: var(--g-border,#f0c8d8);
  background: var(--g-bg-secondary,#ffeaf2);
  color: var(--g-text,#3d1a2a);
}

/* Mobile */
@media (max-width: 360px) {
  .game-area {
    padding: 12px 10px;
  }
  .scores {
    gap: 4px;
  }
  .score-item {
    min-width: 54px;
    padding: 4px 8px;
  }
}
/* 返回按钮 */
.back-btn {
  background: none; border: none; cursor: pointer; padding: 4px; margin-right: 2px;
  color: var(--g-text-secondary, #bfa0aa); display: flex; align-items: center; justify-content: center;
  border-radius: 6px; transition: all 0.2s; flex-shrink: 0;
}
.back-btn:hover { color: var(--g-primary, #ec6b9e); background: var(--g-surface, rgba(236,107,158,0.08)); }
/* 成就提示 */
.ach-toast {
  position: fixed; top: 20px; right: 20px; z-index: 9999;
  background: var(--g-surface, #fff); border: 1px solid var(--g-primary, #ec6b9e);
  border-radius: 10px; padding: 12px 18px; display: flex; align-items: center; gap: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12); transform: translateX(120%); opacity: 0;
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  max-width: 280px; font-size: 13px; color: var(--g-text, #3d1a2a);
}
.ach-toast.show { transform: translateX(0); opacity: 1; }
.ach-toast .ach-icon { font-size: 28px; flex-shrink: 0; }
.ach-toast strong { color: var(--g-primary, #ec6b9e); }
/* 难度选择 */
.mode-bar { display: flex; gap: 6px; justify-content: center; margin: 8px 0; }
.mode-btn {
  padding: 4px 14px; border-radius: 14px; border: 1px solid var(--g-border, #f0c8d8);
  background: var(--g-bg, #fff5f8); color: var(--g-text-secondary, #bfa0aa);
  font-size: 12px; cursor: pointer; transition: all 0.2s;
}
.mode-btn.active { background: var(--g-primary, #ec6b9e); color: #fff; border-color: var(--g-primary, #ec6b9e); }
/* 响应式断点 */
@media (min-width: 900px) {
  .container { padding: 24px; }
  .game-header { margin-bottom: 16px; }
}
@media (max-width: 600px) {
  .container { width: 100%; padding: 12px; }
}
</style>
<script src="./theme-bridge.js"></script>
</head>
<body>
<div class="container">
<div class="game-area">
  <!-- 标题栏 -->
  <div class="game-header">
    <button class="back-btn" onclick="goBack()" title="返回游戏大厅">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="7" cy="12" r="4"/>
      <path d="M14 8l6 8"/><path d="M20 8l-6 8"/>
    </svg>
    <span class="title-text">青孤项目 · 井字棋</span>
    <span class="title-sub" onclick="if(typeof toggleGameTheme==='function')toggleGameTheme()">主题切换</span>
  </div>

  <!-- AI Difficulty -->
  <div class="mode-bar">
    <button class="mode-btn" data-diff="easy" onclick="setDifficulty('easy')">简单</button>
    <button class="mode-btn active" data-diff="medium" onclick="setDifficulty('medium')">中等</button>
  </div>

  <!-- Scores -->
  <div class="scores">
    <div class="score-item player">
      <span class="val" id="playerScore">0</span>
      你 ❌
    </div>
    <div class="score-item draw">
      <span class="val" id="drawScore">0</span>
      平局
    </div>
    <div class="score-item ai">
      <span class="val" id="aiScore">0</span>
      AI ⭕
    </div>
  </div>

  <!-- Turn indicator -->
  <div class="turns" id="turnsIndicator">
    <span class="turn-item active" id="turnPlayer">🧑 你的回合</span>
    <span class="turn-item" id="turnAI">🤖 AI 思考中</span>
  </div>

  <!-- Status -->
  <div class="status" id="status">点击格子开始对局</div>

  <!-- Grid -->
  <div class="grid-container">
    <div class="grid" id="grid">
      <!-- 9 cells generated by JS -->
    </div>
    <svg class="win-line-svg" id="winLineSvg">
      <line class="win-line" id="winLine" x1="0" y1="0" x2="0" y2="0"/>
    </svg>
  </div>

  <!-- Buttons -->
  <div class="btn-row">
    <button class="btn btn-green" id="restartBtn">重新开始</button>
    <button class="btn btn-red" id="resetScoreBtn">重置分数</button>
  </div>
</div>
</div>
<script>
// === 返回按钮 & 成就系统 & 最高分 & AI难度 ===
function goBack() {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: 'game-back' }, '*');
  } else {
    window.history.back();
  }
}

const ACH_KEY = 'qg_ach_tictactoe';
const ACHIEVEMENTS = [
  { id: 'a1', name: '首次胜利', desc: '赢得一局对战 AI', icon: '✅', check: (wins) => wins >= 1 },
  { id: 'a2', name: '连胜将军', desc: '累计赢得 5 局', icon: '🔥', check: (wins) => wins >= 5 },
  { id: 'a3', name: '满分王者', desc: '累计赢得 10 局', icon: '👑', check: (wins) => wins >= 10 },
];

let unlockedAch = [];

function loadAch() {
  try {
    const raw = localStorage.getItem(ACH_KEY);
    unlockedAch = raw ? JSON.parse(raw) : [];
  } catch { unlockedAch = []; }
}

function saveAch() {
  try { localStorage.setItem(ACH_KEY, JSON.stringify(unlockedAch)); } catch {}
}

function checkAch(args) {
  ACHIEVEMENTS.forEach(ach => {
    if (unlockedAch.includes(ach.id)) return;
    let earned = false;
    if (typeof args.maxTile !== 'undefined') {
      earned = ach.check(args.score, args.maxTile);
    } else if (typeof args.mode !== 'undefined') {
      earned = ach.check(args.mode, args.time);
    } else if (typeof args.wins !== 'undefined') {
      earned = ach.check(args.wins);
    } else {
      earned = ach.check(args.score);
    }
    if (earned) {
      unlockedAch.push(ach.id);
      saveAch();
      showAchToast(ach);
    }
  });
}

function showAchToast(ach) {
  const toast = document.createElement('div');
  toast.className = 'ach-toast';
  toast.innerHTML = '<span class="ach-icon">' + ach.icon + '</span><div><strong>成就解锁!</strong><br>' + ach.name + ' — ' + ach.desc + '</div>';
  document.body.appendChild(toast);
  requestAnimationFrame(function() { toast.classList.add('show'); });
  setTimeout(function() { toast.classList.remove('show'); setTimeout(function() { toast.remove(); }, 400); }, 2800);
}

const HS_KEY = 'qg_hs_tictactoe';

function loadHighScore() {
  try {
    var raw = localStorage.getItem(HS_KEY);
    if (raw) { var d = JSON.parse(raw); return d.wins || 0; }
  } catch {}
  return 0;
}

function saveHighScore(wins) {
  var current = loadHighScore();
  if (wins > current) {
    try { localStorage.setItem(HS_KEY, JSON.stringify({ wins: wins, date: new Date().toISOString() })); } catch {}
    return wins;
  }
  return current;
}

var aiDifficulty = 'medium';

function setDifficulty(d) {
  aiDifficulty = d;
  document.querySelectorAll('.mode-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.diff === d); });
}

(function(){
  /* ---- constants ---- */
  const LINES = [
    [0,1,2], [3,4,5], [6,7,8],
    [0,3,6], [1,4,7], [2,5,8],
    [0,4,8], [2,4,6]
  ];

  /* ---- state ---- */
  let board = Array(9).fill(null);       // null | 'X' | 'O'
  let gameActive = false;
  let isPlayerTurn = true;              // player goes first
  const playerMark = 'X';
  const aiMark = 'O';
  let scores = { player: 0, ai: 0, draw: 0 };
  let gameOverFlag = false;             // prevents further moves
  let aiTimeout = null;

  /* ---- DOM refs ---- */
  const grid = document.getElementById('grid');
  const status = document.getElementById('status');
  const playerScoreEl = document.getElementById('playerScore');
  const aiScoreEl = document.getElementById('aiScore');
  const drawScoreEl = document.getElementById('drawScore');
  const restartBtn = document.getElementById('restartBtn');
  const resetScoreBtn = document.getElementById('resetScoreBtn');
  const winLineSvg = document.getElementById('winLineSvg');
  const winLine = document.getElementById('winLine');
  const turnPlayer = document.getElementById('turnPlayer');
  const turnAI = document.getElementById('turnAI');

  /* ---- create cells ---- */
  const cells = [];
  for (let i = 0; i < 9; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.idx = i;

    const markSpan = document.createElement('span');
    markSpan.className = 'mark';
    cell.appendChild(markSpan);

    grid.appendChild(cell);
    cells.push(cell);

    cell.addEventListener('click', () => handleCellClick(i));
  }

  /* ---- win detection ---- */
  function checkWinner(boardArr) {
    for (const [a,b,c] of LINES) {
      if (boardArr[a] && boardArr[a] === boardArr[b] && boardArr[a] === boardArr[c]) {
        return { winner: boardArr[a], line: [a,b,c] };
      }
    }
    return null;
  }

  function isFull(boardArr) {
    return boardArr.every(v => v !== null);
  }

  /* ---- UI update ---- */
  function updateTurnIndicator() {
    if (!gameActive || gameOverFlag) {
      turnPlayer.classList.remove('active');
      turnAI.classList.remove('active');
      return;
    }
    turnPlayer.classList.toggle('active', isPlayerTurn);
    turnAI.classList.toggle('active', !isPlayerTurn);
  }

  function renderBoard() {
    for (let i = 0; i < 9; i++) {
      const cell = cells[i];
      const mark = cell.querySelector('.mark');
      if (board[i] === 'X') {
        mark.textContent = '✕';
        mark.className = 'mark mark-x';
        cell.classList.add('taken');
      } else if (board[i] === 'O') {
        mark.textContent = '◯';
        mark.className = 'mark mark-o';
        cell.classList.add('taken');
      } else {
        mark.textContent = '';
        mark.className = 'mark';
        cell.classList.remove('taken');
      }
    }
  }

  function updateScores() {
    playerScoreEl.textContent = scores.player;
    aiScoreEl.textContent = scores.ai;
    drawScoreEl.textContent = scores.draw;
  }

  function clearWinLine() {
    winLine.style.strokeDasharray = '0';
    winLine.style.strokeDashoffset = '0';
    winLine.setAttribute('x1', '0');
    winLine.setAttribute('y1', '0');
    winLine.setAttribute('x2', '0');
    winLine.setAttribute('y2', '0');
  }

  function removeWinHighlights() {
    cells.forEach(c => c.classList.remove('win-cell'));
  }

  /* ---- win line animation ---- */
  function showWinLine(winningCells) {
    const gridEl = document.querySelector('.grid');
    const gRect = gridEl.getBoundingClientRect();

    // Calculate center of first and last cell
    const c0 = cells[winningCells[0]];
    const c2 = cells[winningCells[2]];
    const r0 = c0.getBoundingClientRect();
    const r2 = c2.getBoundingClientRect();

    // Convert to SVG coordinates (percentage of grid container)
    const svg = winLineSvg;
    const svgRect = svg.getBoundingClientRect();

    const x1 = ((r0.left + r0.width / 2) - svgRect.left) / svgRect.width * 100;
    const y1 = ((r0.top + r0.height / 2) - svgRect.top) / svgRect.height * 100;
    const x2 = ((r2.left + r2.width / 2) - svgRect.left) / svgRect.width * 100;
    const y2 = ((r2.top + r2.height / 2) - svgRect.top) / svgRect.height * 100;

    // Set line coordinates as percentages
    winLine.setAttribute('x1', x1 + '%');
    winLine.setAttribute('y1', y1 + '%');
    winLine.setAttribute('x2', x2 + '%');
    winLine.setAttribute('y2', y2 + '%');

    // Calculate length
    const dx = (x2 - x1) / 100 * svgRect.width;
    const dy = (y2 - y1) / 100 * svgRect.height;
    const length = Math.sqrt(dx * dx + dy * dy);

    // Reset and animate
    winLine.style.strokeDasharray = length + 'px';
    winLine.style.strokeDashoffset = length + 'px';

    requestAnimationFrame(() => {
      winLine.style.transition = 'stroke-dashoffset 0.45s ease';
      winLine.style.strokeDashoffset = '0px';
    });

    // Highlight winning cells
    winningCells.forEach(idx => cells[idx].classList.add('win-cell'));
  }

  /* ---- game flow ---- */
  function handleCellClick(idx) {
    if (!gameActive || gameOverFlag) return;
    if (!isPlayerTurn) return;
    if (board[idx] !== null) return;

    makeMove(idx, playerMark);
  }

  function makeMove(idx, mark) {
    board[idx] = mark;
    renderBoard();

    // Check result
    const result = checkWinner(board);
    if (result) {
      endGame(result.winner, result.line);
      return;
    }

    if (isFull(board)) {
      endGame('draw');
      return;
    }

    // Switch turn
    isPlayerTurn = (mark === aiMark);
    updateTurnIndicator();

    if (!isPlayerTurn && gameActive && !gameOverFlag) {
      scheduleAIMove();
    }
  }

  function scheduleAIMove() {
    if (aiTimeout) clearTimeout(aiTimeout);
    aiTimeout = setTimeout(() => {
      aiTimeout = null;
      if (gameActive && !gameOverFlag && !isPlayerTurn) {
        const idx = getAIMove();
        if (idx !== -1) {
          makeMove(idx, aiMark);
        }
      }
    }, 400); // Small delay for natural feel
  }

  function endGame(winner, line) {
    gameOverFlag = true;
    if (aiTimeout) {
      clearTimeout(aiTimeout);
      aiTimeout = null;
    }

    if (winner === playerMark) {
      scores.player++;
      checkAch({ wins: scores.player });
      saveHighScore(scores.player);
      status.innerHTML = '🎉 你赢了！';
      if (line) showWinLine(line);
    } else if (winner === aiMark) {
      scores.ai++;
      status.innerHTML = '😔 AI 赢了！';
      if (line) showWinLine(line);
    } else {
      scores.draw++;
      status.innerHTML = '🤝 平局！';
    }

    updateScores();
    updateTurnIndicator();
  }

  /* ---- AI logic ---- */
  function getAIMove() {
    if (aiDifficulty === 'easy') {
      // 随机选择可用位置
      const available = [];
      for (let i = 0; i < 9; i++) { if (!board[i]) available.push(i); }
      return available.length > 0 ? available[Math.floor(Math.random() * available.length)] : -1;
    }
    // medium: 使用现有策略
    // 1. Win if possible
    for (let i = 0; i < 9; i++) {
      if (board[i] === null) {
        board[i] = aiMark;
        if (checkWinner(board)) { board[i] = null; return i; }
        board[i] = null;
      }
    }

    // 2. Block player's win
    for (let i = 0; i < 9; i++) {
      if (board[i] === null) {
        board[i] = playerMark;
        if (checkWinner(board)) { board[i] = null; return i; }
        board[i] = null;
      }
    }

    // 3. Take center
    if (board[4] === null) return 4;

    // 4. Take a corner
    const corners = [0, 2, 6, 8];
    const availCorners = corners.filter(i => board[i] === null);
    if (availCorners.length > 0) {
      return availCorners[Math.floor(Math.random() * availCorners.length)];
    }

    // 5. Take any
    const avail = [];
    for (let i = 0; i < 9; i++) {
      if (board[i] === null) avail.push(i);
    }
    return avail.length > 0 ? avail[Math.floor(Math.random() * avail.length)] : -1;
  }

  /* ---- reset ---- */
  function resetBoard() {
    loadAch();
    if (aiTimeout) {
      clearTimeout(aiTimeout);
      aiTimeout = null;
    }

    board = Array(9).fill(null);
    gameActive = true;
    isPlayerTurn = true;
    gameOverFlag = false;

    renderBoard();
    clearWinLine();
    removeWinHighlights();
    updateTurnIndicator();
    status.innerHTML = '你的回合，点击格子落子 ❌';
  }

  function resetScores() {
    scores = { player: 0, ai: 0, draw: 0 };
    updateScores();
    resetBoard();
  }

  /* ---- events ---- */
  restartBtn.addEventListener('click', resetBoard);
  resetScoreBtn.addEventListener('click', resetScores);

  /* ---- init ---- */
  resetBoard();
})();
</script>
</body>
</html>
